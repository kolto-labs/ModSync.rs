# Metadata
fileFormatVersion: "2.0"
preambleContent: "# Installation Guide\n\nWelcome to the KOTOR Mod Installation Guide. This guide will help you install this mod build for Knights of the Old Republic.\n\n:::warning\nImportant\n:   Please read through these instructions carefully before beginning the installation process.\n:::\n\n### Prerequisites\n\n- A fresh installation of Knights of the Old Republic\n- ModSync - an automated installer that handles TSLPatcher and HoloPatcher installations\n- Approximately 7GB free disk space for mod archives (before extraction)\n\n### Installation Process\n\nModSync will automatically handle extraction and installation of mods. You just need to:\n\n1. Ensure your game directory is not read-only\n2. Configure your source (mod archives) and destination (game directory) paths\n3. Select the mods you want to install\n4. Let the installer handle the rest\n\n:::warning\nZeroing Step\n:   If you have previously installed mods, it's recommended to perform a fresh install. Uninstall the game, delete all remaining files in the game directory, and reinstall before proceeding.\n:::\n\n### Known Issues\n\n- Some users may experience rare crashes when entering new areas. If this occurs, temporarily disable 'Frame Buffer Effects' and 'Soft Shadows' in Advanced Graphics Options."
epilogueContent: "## Post-Installation Notes\n\n### Launch Options\n\nAfter installation, launch the game directly from the executable, not through the Steam interface (if using widescreen support).\n\n### Troubleshooting\n\nIf you encounter issues:\n\n- **Crash on load**: Try disabling 'Frame Buffer Effects' in Advanced Graphics Options\n- **Character stuck after combat**: Enable v-sync or set your monitor to 60hz\n- **Rare crashes**: Update your graphics drivers\n\nFor additional support, please consult the troubleshooting section in the main documentation."
widescreenWarningContent: ":::note\nWidescreen Support\n:   This build includes optional widescreen support. Widescreen mods must be installed before applying the 4GB patcher. Please see the widescreen section below for details.\n:::"
aspyrExclusiveWarningContent: ":::warning\nAspyr Version Required\n:   The following mods require the Aspyr patch version of KOTOR 2. If you are using the legacy version, these mods should be skipped.\n:::"
installationWarningContent: ":::warning\nInstallation Warning\n:   This mod build is intended for use with the Aspyr patch version of KOTOR 2. If you are using the legacy version, some mods may not work correctly.\n:::"

