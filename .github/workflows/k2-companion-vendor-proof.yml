name: Original Companion Starting Armors reference witness
on:
  push:
    branches: [fix/fullrun-ci-credentials]
    paths: [.github/workflows/k2-companion-vendor-proof.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: k2-companion-vendor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    if: github.repository == 'kolto-labs/ModSync.rs' && github.ref == 'refs/heads/fix/fullrun-ci-credentials'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare reference runtime without building ModSync
        timeout-minutes: 15
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/companion-evidence"
          test -n "$RECIPIENT"
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends age bubblewrap wine wine32:i386 wine64 xvfb xauth xdotool zstd openssl python3-pip
          /usr/bin/python3 -m pip install --target "$RUNNER_TEMP/companion-python" pykotor==2.3.12
        env:
          RECIPIENT: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
      - name: Acquire target-owned genuine baseline and one pinned original archive
        timeout-minutes: 35
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_TOKEN: ${{ github.token }}
          ARTSTORE_REPOSITORY: ${{ github.repository }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          umask 077
          python - <<'PY' >"$RUNNER_TEMP/companion-evidence/acquisition.log" 2>&1
          import hashlib,json,os,re,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import artstore,artstore_client,fullrun_baseline,manual
          root=Path(os.environ['RUNNER_TEMP']); evidence=root/'companion-evidence'
          report={'scope':'original vendor reference only; no native/full-guide approval','status':'acquiring'}
          def save(): (evidence/'material-provenance.json').write_text(json.dumps(report,indent=2))
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(4*1024*1024),b''): h.update(b)
              return h.hexdigest()
          def metadata(item):
              return {k:item[k] for k in ('id','name','size_in_bytes','digest','expired','created_at','expires_at','workflow_run') if k in item}
          try:
              save()
              assert os.environ['GITHUB_REPOSITORY']==os.environ['ARTSTORE_REPOSITORY']=='kolto-labs/ModSync.rs'
              assert os.environ['GITHUB_REF']=='refs/heads/fix/fullrun-ci-credentials'
              pins={'tools/modsync-ci/manual.py':'1794618a29d0ed9c42406b5395e66eb6eb9d6ebc8b6a70a92d8e9220bf46a8b7',
                    'tools/modsync-ci/fixtures/ci/k2-manual-plan.json':'0add8c1aeb7cdfad3df4b21761e135c150aa7832cf3fc0edabe01a91245a9258',
                    'src/archive_generation/reviewed_manual_single_ini_k2.json':'2eee9ca0321722919306743903b18a872c1be1954c547963b3a737a270679fbe'}
              for path,digest in pins.items(): assert sha(Path(path))==digest,path
              plan=manual.read_plan(Path('tools/modsync-ci/fixtures/ci/k2-manual-plan.json'))
              book=manual.read_plan(Path('src/archive_generation/reviewed_manual_single_ini_k2.json'))
              recipe,=[r for r in book['recipes'] if r['component_guid']=='f27d4b13-b349-8c56-b9b7-620cdc133579']
              assert recipe['plan_step_index']==recipe['source_component_index']==134
              assert recipe['plan_step']==plan['steps'][134]
              assert book['source_plan_sha256']==pins['tools/modsync-ci/fixtures/ci/k2-manual-plan.json']
              assert book['source_guide_sha256']==plan['guide_sha256']
              assert recipe['plan_step']['id']=='step-135'
              pin,=recipe['archives']; archive_sha='782bd218cb37ce5313e0ada4f86a9099475bb40913a9a3bc3a063e31323d03c4'
              assert pin=={'filename':'K2 Companion Starting Armors 1.1.zip','sha256':archive_sha}
              assert plan['archive_sha256']['{archives}/'+pin['filename']]==archive_sha
              report.update(source_pins=pins,head=os.environ['GITHUB_SHA'],recipe=recipe,run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])
              save()
              result=fullrun_baseline.recover('k2',root/'companion-sealed',root/'companion-game',audit_backup=False)
              assert result['available'] and result['origin'].startswith('artifact:current:kolto-labs/ModSync.rs:')
              client=artstore_client.from_environment(); listing=client.list_artifacts()
              baseline_id=int(result['origin'].rsplit(':',1)[1])
              baseline,=[a for a in listing if int(a['id'])==baseline_id]
              assert not baseline['expired'] and re.fullmatch('sha256:[0-9a-f]{64}',baseline['digest'])
              report.update(baseline=result,baseline_api=metadata(baseline),baseline_seal_sha256=sha(root/'companion-sealed/baseline.seal'))
              save()
              index=artstore.load_index(client); blob=index['blobs'][archive_sha]
              assert 0<blob['size']<=50*1024*1024
              packs={p['pack']:index['packs'][p['pack']] for p in blob['parts']}
              ids={int(p['artifact_id']) for p in packs.values()}
              api=[metadata(a) for a in listing if int(a['id']) in ids]
              assert {int(a['id']) for a in api}==ids
              assert all(not a['expired'] and re.fullmatch('sha256:[0-9a-f]{64}',a['digest']) for a in api)
              report.update(archive_blob=blob,archive_packs=packs,archive_pack_api=api,
                            authentication='target repository builtin token; verified baseline ZIP; artstore stored-part SHA256, authenticated decrypt and joined plaintext SHA256')
              save()
              archives=root/'companion-archives'; archives.mkdir(mode=0o700)
              archive=archives/pin['filename']
              assert artstore.fetch(archive_sha,archive,client=client,index=index,workdir=root/'companion-parts')
              assert archive.is_file() and not archive.is_symlink() and archive.stat().st_size==blob['size'] and sha(archive)==archive_sha
              # Full genuine tree, never normalize/rename/write game files before installation.
              before=manual.manifest(root/'companion-game')
              (evidence/'game-before.json').write_text(json.dumps(before,sort_keys=True))
              report.update(status='acquired',before_manifest_sha256=sha(evidence/'game-before.json'),before_entries=len(before))
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__)
              raise
          finally: save()
          PY
      - name: Prepare sandbox worker with exact original GUI operation
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/companion-runtime"
          cat >"$RUNNER_TEMP/companion-runtime/worker.py" <<'PY'
          import json,os,signal,subprocess,sys,time
          from pathlib import Path
          sys.path.insert(0,'/reference')
          import manual
          work=Path('/work'); prefix=work/'prefix'; prefix.mkdir(mode=0o700)
          home=work/'home'; home.mkdir(mode=0o700)
          assert os.getuid()!=0
          assert os.environ['WINEARCH']=='win32'
          assert not any('TOKEN' in k or 'ENCRYPTION' in k for k in os.environ)
          def command(args,timeout=120):
              # Helpers also own a process group; terminate the entire group on timeout.
              p=subprocess.Popen(args,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  assert p.wait(timeout=timeout)==0,args[0]
              finally:
                  try: os.killpg(p.pid,signal.SIGKILL)
                  except ProcessLookupError: pass
                  p.wait()
          def quiesce():
              command(['/usr/bin/wineserver','-k'],30)
              command(['/usr/bin/wineserver','-w'],60)
          def drives():
              found={p.name:p.resolve(strict=True) for p in (prefix/'dosdevices').iterdir()}
              assert found=={'c:':(prefix/'drive_c').resolve(),'d:':Path('/game')},found
              for p in prefix.rglob('*'):
                  if p.is_symlink():
                      target=p.resolve(strict=True)
                      assert target.is_relative_to(prefix) or target==Path('/game'),str(p)
          state={'status':'starting','quiescent':False,'scope':'original single-component reference on recovered clean baseline'}
          def save(): (work/'runtime.json').write_text(json.dumps(state,indent=2))
          with (work/'runtime.log').open('wb') as log:
              try:
                  save()
                  command(['/usr/bin/wineboot','--init'])
                  quiesce()
                  # Wine's initial host mappings and shell links must never reach the patcher.
                  for p in (prefix/'dosdevices').iterdir():
                      if p.name!='c:':
                          assert p.is_symlink(); p.unlink()
                  (prefix/'dosdevices/d:').symlink_to('/game',target_is_directory=True)
                  for p in prefix.rglob('*'):
                      if p.is_symlink() and not p.resolve().is_relative_to(prefix) and p!=prefix/'dosdevices/d:':
                          p.unlink()
                  drives()
                  plan=manual.read_plan(Path('/reference/plan.json'))
                  recipe=json.loads(Path('/reference/recipe.json').read_text())
                  step=plan['steps'][134]; assert step==recipe['plan_step']
                  # The EXE and its adjacent data must also be reachable through C:.
                  # A host-only extraction root would require the forbidden Z: mapping.
                  roots={'game':Path('/game'),'archives':Path('/archives'),'extract':prefix/'drive_c/reference-extract'}
                  roots['extract'].mkdir(mode=0o700)
                  extraction,operation=step['operations']
                  manual.validate_operation(extraction,roots); manual.validate_operation(operation,roots)
                  archive=manual.path_token(extraction['source'],roots,('archives',))
                  destination=manual.path_token(extraction['destination'],roots,('extract',))
                  manual.extract(archive,destination,time.monotonic()+180)
                  for name in ('installer','changes_ini'):
                      pin=recipe['native_patcher'][name]; path=destination/pin['path']
                      assert path.is_file() and not path.is_symlink()
                      assert path.stat().st_size==pin['bytes'] and manual.sha256(path)==pin['sha256']
                  assert not (destination/'installlog.rtf').exists()
                  # The sole local helper override: same actions, registry entries and original argv.
                  manual.game_win=lambda roots: 'D:\\'
                  assert manual.manifest(roots['game'])==json.loads(Path('/reference/game-before.json').read_text()),'baseline changed before installer'
                  state['status']='installing'; save()
                  manual.run_gui_patcher(operation,roots,log,time.monotonic()+900)
                  state['status']='vendor-helper-returned'
              except BaseException as error:
                  state.update(status='failed',failure_category=type(error).__name__)
                  raise
              finally:
                  try:
                      quiesce(); drives(); state['quiescent']=True
                  finally: save()
          PY
      - name: Run rootless network-isolated original and read actual output metadata
        timeout-minutes: 25
        run: |
          env -i PATH=/usr/bin:/bin RUNNER_TEMP="$RUNNER_TEMP" python3 - <<'PY'
          import hashlib,json,os,re,signal,stat,struct,subprocess,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import manual
          root=Path(os.environ['RUNNER_TEMP']); evidence=root/'companion-evidence'; work=root/'companion-runtime'
          game=root/'companion-game'
          report={'status':'starting','scope':'reference only; no selector interpretation or native/full-guide approval'}
          def sha(p): return manual.sha256(p)
          def save(): (evidence/'vendor-witness.json').write_text(json.dumps(report,indent=2))
          def locstring_bytes(data):
              # Read-only GFF V3.2 parser, bounded independently of archive/game size.
              assert 56<=len(data)<=4*1024*1024
              def span(offset,size):
                  assert 0<=offset<=len(data) and 0<=size<=len(data)-offset
                  return data[offset:offset+size]
              def u32(offset): return struct.unpack('<I',span(offset,4))[0]
              assert span(0,8)==b'UTI V3.2'
              so,sc,fo,fc,lo,lc,do,dc,fio,fic,lio,lic=struct.unpack('<12I',span(8,48))
              assert 0<sc<=100000 and 0<fc<=100000 and 0<lc<=100000
              for o,n in ((so,sc*12),(fo,fc*12),(lo,lc*16),(do,dc),(fio,fic),(lio,lic)): span(o,n)
              count=u32(so+8); assert 0<count<=10000
              start=u32(so+4)
              if count==1: indices=[start]
              else:
                  assert start+count*4<=fic
                  indices=list(struct.unpack('<'+'I'*count,span(fio+start,count*4)))
              matches=[]
              for i in indices:
                  assert i<fc
                  kind,label,value=struct.unpack('<III',span(fo+i*12,12)); assert label<lc
                  if span(lo+label*16,16).split(b'\0',1)[0]==b'DescIdentified': matches.append((kind,value))
              (kind,value),=matches; assert kind==12 and value+4<=dc
              size=u32(do+value); assert 8<=size<=1024*1024 and value+4+size<=dc
              end=do+value+4+size; cursor=do+value+4
              strref=u32(cursor); count=u32(cursor+4); cursor+=8; assert count<=1024
              strings=[]; ids=set()
              for _ in range(count):
                  assert cursor+8<=end
                  sid=u32(cursor); length=u32(cursor+4); cursor+=8
                  assert sid not in ids and length<=65536 and cursor+length<=end
                  ids.add(sid); raw=span(cursor,length); cursor+=length
                  # Preserve bytes as well as a reversible display; never infer language from -1.
                  strings.append({'substring_id':sid,'text_cp1252':raw.decode('cp1252',errors='backslashreplace'),
                                  'text_hex':raw.hex(),'bytes':length,'sha256':hashlib.sha256(raw).hexdigest()})
              assert cursor==end
              return {'file_sha256':hashlib.sha256(data).hexdigest(),'file_bytes':len(data),'strref_unsigned':strref,'substrings':strings,
                      'locstring_sha256':hashlib.sha256(span(do+value,4+size)).hexdigest()}
          def locstring(path):
              assert path.is_file() and not path.is_symlink() and 56<=path.stat().st_size<=4*1024*1024
              return locstring_bytes(path.read_bytes())
          p=None
          try:
              save(); assert os.getuid()!=0
              before=json.loads((evidence/'game-before.json').read_text())
              assert manual.manifest(game)==before,'baseline changed before original installation'
              provenance=json.loads((evidence/'material-provenance.json').read_text())
              recipe=provenance['recipe']
              report['input_fields']={}
              pin,=recipe['archives']
              with zipfile.ZipFile(root/'companion-archives'/pin['filename']) as archive:
                  for name in ('a_light_x02.uti','a_light_x09.uti'):
                      member=archive.getinfo('tslpatchdata/'+name)
                      assert not member.is_dir() and stat.S_IFMT(member.external_attr>>16) in (0,stat.S_IFREG)
                      assert 56<=member.file_size<=4*1024*1024
                      data=archive.read(member); assert len(data)==member.file_size
                      report['input_fields'][name]=locstring_bytes(data)
              save()
              (work/'recipe.json').write_text(json.dumps(recipe))
              args=['/usr/bin/bwrap','--unshare-all','--die-with-parent','--new-session',
                    '--uid',str(os.getuid()),'--gid',str(os.getgid()),'--cap-drop','ALL',
                    '--ro-bind','/usr','/usr','--symlink','usr/bin','/bin','--symlink','usr/lib','/lib',
                    '--symlink','usr/lib64','/lib64','--ro-bind','/etc','/etc',
                    '--proc','/proc','--dev','/dev','--tmpfs','/tmp','--tmpfs','/run',
                    '--dir','/reference','--ro-bind',str(Path('tools/modsync-ci/manual.py').resolve()),'/reference/manual.py',
                    '--ro-bind',str(Path('tools/modsync-ci/fixtures/ci/k2-manual-plan.json').resolve()),'/reference/plan.json',
                    '--ro-bind',str(work/'recipe.json'),'/reference/recipe.json',
                    '--ro-bind',str(evidence/'game-before.json'),'/reference/game-before.json',
                    '--ro-bind',str(work/'worker.py'),'/reference/worker.py',
                    '--ro-bind',str(root/'companion-python'),'/reference/python',
                    '--ro-bind',str(root/'companion-archives'),'/archives',
                    '--bind',str(work),'/work','--bind',str(game),'/game','--chdir','/work',
                    '--clearenv','--setenv','PATH','/usr/bin:/bin','--setenv','HOME','/work/home',
                    '--setenv','PYTHONPATH','/reference/python',
                    '--setenv','WINEPREFIX','/work/prefix','--setenv','WINEARCH','win32',
                    '--setenv','WINEDLLOVERRIDES','mscoree,mshtml=',
                    '--setenv','WINEDEBUG','-all','--setenv','LC_ALL','C.UTF-8',
                    '/usr/bin/xvfb-run','-a','-s','-screen 0 1024x768x24','/usr/bin/python3','/reference/worker.py']
              # No host home, runner temp, workspace, API credentials or network in the namespace.
              with (work/'sandbox.log').open('wb') as log:
                  p=subprocess.Popen(args,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True,env={})
                  try: code=p.wait(timeout=1200)
                  finally:
                      try: os.killpg(p.pid,signal.SIGKILL)
                      except ProcessLookupError: pass
                      p.wait()
              runtime_path=work/'runtime.json'
              assert runtime_path.is_file() and not runtime_path.is_symlink() and runtime_path.stat().st_size<=65536
              runtime=json.loads(runtime_path.read_text()); report['runtime']=runtime
              assert runtime['quiescent'] is True,'Wine quiescence not established'
              # Namespace PID 1 has exited: escaped child groups cannot survive its destruction.
              after=manual.manifest(game)
              (evidence/'game-after.json').write_text(json.dumps(after,sort_keys=True))
              report.update(before_manifest_sha256=sha(evidence/'game-before.json'),after_manifest_sha256=sha(evidence/'game-after.json'),
                            added=sum(k not in before for k in after),removed=sum(k not in after for k in before),
                            changed=sum(after[k]!=before[k] for k in before.keys()&after.keys()),sandbox_exit=code)
              assert code==0 and runtime['status']=='vendor-helper-returned'
              assert before!=after
              destination=work/'prefix/drive_c/reference-extract/step-135/1'
              log=destination/'installlog.rtf'
              assert log.is_file() and not log.is_symlink() and log.resolve().is_relative_to(work.resolve()) and 0<log.stat().st_size<=1024*1024
              raw=log.read_bytes(); text=manual.decode_installer_log(raw,manual.GUI_LOG_ENCODINGS)
              operation=recipe['plan_step']['operations'][1]
              markers,failed=manual.log_verdict(text,operation); assert markers and not failed
              (evidence/'original-installlog.rtf').write_bytes(raw)
              report['original_log']={'sha256':sha(log),'bytes':len(raw),'success_markers':markers,'failure_regex_matched':failed,
                                      'counter_lines':[line[:2048] for line in text.splitlines() if re.search(r'\b(?:warnings?|errors?|completed|processed)\b',line,re.I)][:32]}
              override,=[p for p in game.iterdir() if p.name.casefold()=='override' and p.is_dir() and not p.is_symlink()]
              report['outputs']={}
              for name in ('a_light_x02.uti','a_light_x09.uti'):
                  path,=[p for p in override.iterdir() if p.name.casefold()==name]
                  report['outputs'][name]=locstring(path)
              report['localized_fields_unchanged']=all(report['outputs'][name]['locstring_sha256']==before['locstring_sha256']
                                                       for name,before in report['input_fields'].items())
              report['status']='original-vendor-observed'
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__)
              raise
          finally:
              # Even a rejected installation gets a complete post-process observation.
              # This is not a success/quiescence claim if the Wine cleanup failed.
              if (p is None or p.poll() is not None) and not (evidence/'game-after.json').exists():
                  try:
                      after=manual.manifest(game)
                      (evidence/'game-after.json').write_text(json.dumps(after,sort_keys=True))
                      report['after_manifest_sha256']=sha(evidence/'game-after.json')
                  except BaseException as error:
                      report['after_manifest_failure']=type(error).__name__
              original=work/'prefix/drive_c/reference-extract/step-135/1/installlog.rtf'
              if original.is_file() and not original.is_symlink() and original.resolve().is_relative_to(work.resolve()) and 0<original.stat().st_size<=1024*1024:
                  (evidence/'original-installlog.rtf').write_bytes(original.read_bytes())
              # Bounded allowlist only. Never retain archives, UTI bytes, game, prefix or screenshots.
              for name in ('runtime.json','runtime.log','sandbox.log'):
                  path=work/name
                  if path.is_file() and not path.is_symlink() and path.stat().st_size<=2*1024*1024:
                      (evidence/name).write_bytes(path.read_bytes())
              save()
          PY
      - name: Bound the private metadata envelope
        if: success() || failure()
        run: |
          env -i PATH=/usr/bin:/bin RUNNER_TEMP="$RUNNER_TEMP" python3 - <<'PY'
          import json,os
          from pathlib import Path
          evidence=Path(os.environ['RUNNER_TEMP'])/'companion-evidence'
          evidence.mkdir(mode=0o700,exist_ok=True)
          allowed={'acquisition.log':2*1024*1024,'material-provenance.json':1024*1024,
                   'game-before.json':64*1024*1024,'game-after.json':64*1024*1024,
                   'vendor-witness.json':4*1024*1024,'original-installlog.rtf':1024*1024,
                   'runtime.json':65536,'runtime.log':2*1024*1024,'sandbox.log':2*1024*1024}
          rejected=[]
          for path in evidence.iterdir():
              if path.is_symlink() or not path.is_file() or path.name not in allowed:
                  raise RuntimeError('unexpected evidence member')
              if path.stat().st_size>allowed[path.name]:
                  rejected.append({'name':path.name,'bytes':path.stat().st_size})
                  path.unlink()
          (evidence/'bounds.json').write_text(json.dumps({'rejected':rejected}))
          assert not rejected,'oversized metadata: proof rejected, bounded diagnostics retained'
          PY
      - name: Retain independently encrypted reference metadata on success or failure
        if: success() || failure()
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/companion-evidence
          name: k2-companion-original-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-recipient: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
