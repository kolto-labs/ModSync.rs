name: Full-run P2P loopback diagnostic
# Loopback transfer and wrong-hash rejection; does not prove remote seeder reachability.
on:
  workflow_call:
    inputs:
      engine_repository: {type: string, required: true}
      engine_sha: {type: string, required: true}
    secrets:
      MODSYNC_SOURCE_TOKEN: {required: false}
permissions: {contents: read}
jobs:
  loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {RUSTUP_TOOLCHAIN: 1.95.0}
    steps:
      - name: Checkout owned CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify the triggering engine commit
        env:
          ENGINE_SHA: ${{ inputs.engine_sha }}
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"
      - name: Prepare production CLI toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
          rustup toolchain install 1.95.0 --profile minimal
      - name: Prefetch locked engine dependencies without persistent Git credentials
        working-directory: .
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_token=${SOURCE_TOKEN:-}
          export -n source_token
          unset SOURCE_TOKEN GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          unset GIT_ASKPASS SSH_ASKPASS GIT_CURL_VERBOSE GIT_CONFIG_PARAMETERS
          for trace_name in "${!GIT_TRACE@}"; do unset "$trace_name"; done
          for config_name in "${!GIT_CONFIG_KEY_@}" "${!GIT_CONFIG_VALUE_@}"; do unset "$config_name"; done
          auth_dir=$(mktemp -d "$RUNNER_TEMP/fullrun-source-auth.XXXXXX")
          cfg="$auth_dir/gitconfig"
          retry_log="$auth_dir/fetch.log"
          trap 'rm -rf -- "$auth_dir"' EXIT
          : > "$cfg"
          export GIT_CONFIG_GLOBAL="$cfg" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_COUNT=0
          export GIT_TERMINAL_PROMPT=0 GIT_TRACE_REDACT=1 CARGO_NET_GIT_FETCH_WITH_CLI=true
          if cargo fetch --locked; then
            unset source_token
            exit 0
          fi
          if [[ -z "$source_token" ]]; then
            echo "::error::Anonymous dependency fetch failed; optional MODSYNC_SOURCE_TOKEN is needed only for private source access."
            exit 1
          fi
          # The optional token reaches only the private temporary Git config,
          # never a child environment or this config writer's argument vector.
          if ! printf '%s' "$source_token" | python -c 'import sys, urllib.parse; token = urllib.parse.quote(sys.stdin.read(), safe=""); print("[url \"https://x-access-token:" + token + "@github.com/\"]\n\tinsteadOf = https://github.com/")' > "$cfg" 2> "$retry_log"; then
            echo "::error::Optional source credential configuration failed. Private output was withheld."
            exit 1
          fi
          unset source_token
          if ! cargo fetch --locked > "$retry_log" 2>&1; then
            echo "::error::Authenticated dependency fallback failed; verify optional MODSYNC_SOURCE_TOKEN access. Private fetch output was withheld."
            exit 1
          fi
      - name: Build production CLI only
        working-directory: .
        run: cargo build --locked --no-default-features --lib --bin modsync -j2
      - name: Verify byte transfer and wrong-hash rejection
        run: python tools/modsync-ci/p2p_loopback.py --binary target/debug/modsync
