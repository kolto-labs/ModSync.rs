name: Certify two original K2 log-delete ZIP inventories
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: k2-log-delete-metadata-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    if: github.repository == 'kolto-labs/ModSync.rs' && github.ref == 'refs/heads/fix/fullrun-ci-credentials'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kolto-labs/mod-builds
          ref: 67dc5fd8da6abde324c51d32eee3d04687070dd6
          path: guide-input
          persist-credentials: false
      - name: Prepare private acquisition and metadata directories
        timeout-minutes: 10
        env:
          DIAGNOSTICS_RECIPIENT: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
        run: |
          umask 077
          test -n "$DIAGNOSTICS_RECIPIENT"
          mkdir -p "$RUNNER_TEMP/k2-log-delete-evidence" "$RUNNER_TEMP/k2-log-delete-private"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends age zstd openssl
      - name: Fetch only two original owned objects and certify every ZIP entry
        timeout-minutes: 22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_TOKEN: ${{ github.token }}
          ARTSTORE_REPOSITORY: ${{ github.repository }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python - <<'PY'
          import configparser,hashlib,json,os,stat,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import artstore,artstore_client
          os.umask(0o077)
          root=Path(os.environ['RUNNER_TEMP']); evidence=root/'k2-log-delete-evidence'; private=root/'k2-log-delete-private'
          guide_sha='f442bdf574031623ed577609730d887069b9bc8e38e8e2f38ecc43a7e7487d5f'
          plan_sha='0add8c1aeb7cdfad3df4b21761e135c150aa7832cf3fc0edabe01a91245a9258'
          exe_sha='013655cd871a71e0f5b50f80ed0d32308912916ba7e12e2a366f42d992a71b16'
          targets=[
              {'label':'trandoshans','guid':'2de86e49-571f-8600-931e-5bc2ad5acebe','name':'Rescaled Trandoshans',
               'filename':'Rescaled Trandoshans.zip','sha256':'f8939839eac387aa8e120116686baa7281b3226cdb5b941ba7d7389040e5b644',
               'bytes':528129,'members':9,'file_bytes':1306338,'component_index':121,'plan_index':121,'step':'step-122',
               'parent':'Rescaled Trandoshans','installer':'Rescaled Trandoshans/TSLPatcher.exe',
               'ini':'Rescaled Trandoshans/tslpatchdata/changes.ini','ini_bytes':1478,
               'ini_sha256':'234c8196ef71e982549f99ae55ee0991f4e67350dd41a6ed890fff979bfcfab6','log_bytes':759},
              {'label':'blasters','guid':'3eb56efe-013e-8095-80cf-a2584ba2cf94','name':'High Quality Blasters',
               'filename':'TSL_High_Quality_Blasters.zip','sha256':'a088f3bf81891ea2713e46e60cdf7926aa30287ed86991788fecc6745f8996c3',
               'bytes':23973258,'members':270,'file_bytes':44522192,'component_index':117,'plan_index':117,'step':'step-118',
               'parent':'Install','installer':'Install/High Quality Blasters Installer.exe',
               'ini':'Install/tslpatchdata/changes.ini','ini_bytes':9336,
               'ini_sha256':'4857fa86e58ee945c2bfcd50a5f9b1c37b47f683553f9455017326386e39dea5','log_bytes':20634}]
          # Recorded complete raw/canonical original owners: metadata context only.
          # These do not grant approval or establish fresh canonical-loader equivalence.
          contexts=json.loads(r'''{"2de86e49-571f-8600-931e-5bc2ad5acebe":{"raw":{"Guid":"2de86e49-571f-8600-931e-5bc2ad5acebe","Name":"Rescaled Trandoshans","Author":"Schizo","Description":"Canonically Trandoshans are huge, almost as tall as a Wookiee. This mod rescales them to the proper height.","Directions":"","Tier":"4 - Optional","Category":["Immersion"],"IsSelected":true,"Dependencies":[],"Restrictions":[],"InstallBefore":[],"InstallAfter":[],"Instructions":[],"Options":[],"ResourceRegistry":{"https://deadlystream.com/files/file/946-re-scaled-trandoshans/":{"Files":{},"HandlerMetadata":{}}},"DraftReview":{"RequiresReview":true,"Result":{"ComponentGuid":"2de86e49-571f-8600-931e-5bc2ad5acebe","DraftInstructionCount":0,"UnparsedGaps":["Installation method requires observed archive contents and explicit review before its sources, destinations, exclusions, and installer choices can be bound; no actions were generated from the method or guide defaults."],"ConditionalDrafts":[],"RejectedDrafts":0},"MethodContext":{"Method":"TSLPatcher Mod","MethodTruncated":false,"Kind":"Patcher","GuideDefaults":{"PreambleStatus":"Inspected","PatcherDestination":"<<kotorDirectory>>","LooseFilesDestination":"<<kotorDirectory>>\\Override","NoOverrideOrModulesSubfolders":true},"ExplicitDirectionsTakePrecedence":true,"ArchiveBinding":"Unresolved"}},"InstallationMethod":"TSLPatcher Mod","InstallationWarning":"DRAFT INSTRUCTIONS: parsed from guide prose by the natural-language importer. Review before installing - never auto-trusted.","Language":["YES"],"NameFieldContent":"[Rescaled Trandoshans](https://deadlystream.com/files/file/946-re-scaled-trandoshans/)","WidescreenOnly":false},"canonical":{"Guid":"2de86e49-571f-8600-931e-5bc2ad5acebe","Name":"Rescaled Trandoshans","Author":"Schizo","Description":"Canonically Trandoshans are huge, almost as tall as a Wookiee. This mod rescales them to the proper height.","Directions":"","Tier":"4 - Optional","Category":["Immersion"],"IsSelected":true,"Dependencies":[],"Restrictions":[],"InstallBefore":[],"InstallAfter":[],"Instructions":[],"Options":[],"ResourceRegistry":{"https://deadlystream.com/files/file/946-re-scaled-trandoshans/":{"Files":{},"HandlerMetadata":{}}},"DraftReview":{"RequiresReview":true,"Result":{"ComponentGuid":"2de86e49-571f-8600-931e-5bc2ad5acebe","DraftInstructionCount":0,"UnparsedGaps":["Installation method requires observed archive contents and explicit review before its sources, destinations, exclusions, and installer choices can be bound; no actions were generated from the method or guide defaults."],"ConditionalDrafts":[],"RejectedDrafts":0},"MethodContext":{"Method":"TSLPatcher Mod","MethodTruncated":false,"Kind":"Patcher","GuideDefaults":{"PreambleStatus":"Inspected","PatcherDestination":"<<kotorDirectory>>","LooseFilesDestination":"<<kotorDirectory>>\\Override","NoOverrideOrModulesSubfolders":true},"ExplicitDirectionsTakePrecedence":true,"ArchiveBinding":"Unresolved"}},"InstallationMethod":"TSLPatcher Mod","InstallationWarning":"DRAFT INSTRUCTIONS: parsed from guide prose by the natural-language importer. Review before installing - never auto-trusted.","Language":["YES"],"NameFieldContent":"[Rescaled Trandoshans](https://deadlystream.com/files/file/946-re-scaled-trandoshans/)","WidescreenOnly":false}},"3eb56efe-013e-8095-80cf-a2584ba2cf94":{"raw":{"Guid":"3eb56efe-013e-8095-80cf-a2584ba2cf94","Name":"High Quality Blasters","Author":"Sithspecter","Description":"Massively improves the appearance of almost all blaster weapons in-game without grossly altering their original design.","Directions":"","Tier":"1 - Essential","Category":["Graphics Improvement"],"IsSelected":true,"Dependencies":[],"Restrictions":[],"InstallBefore":[],"InstallAfter":[],"Instructions":[],"Options":[],"ResourceRegistry":{"http://deadlystream.com/files/file/915-high-quality-blasters/":{"Files":{},"HandlerMetadata":{}}},"DraftReview":{"RequiresReview":true,"Result":{"ComponentGuid":"3eb56efe-013e-8095-80cf-a2584ba2cf94","DraftInstructionCount":0,"UnparsedGaps":["Installation method requires observed archive contents and explicit review before its sources, destinations, exclusions, and installer choices can be bound; no actions were generated from the method or guide defaults."],"ConditionalDrafts":[],"RejectedDrafts":0},"MethodContext":{"Method":"TSLPatcher Mod","MethodTruncated":false,"Kind":"Patcher","GuideDefaults":{"PreambleStatus":"Inspected","PatcherDestination":"<<kotorDirectory>>","LooseFilesDestination":"<<kotorDirectory>>\\Override","NoOverrideOrModulesSubfolders":true},"ExplicitDirectionsTakePrecedence":true,"ArchiveBinding":"Unresolved"}},"Heading":"HQ Blasters","InstallationMethod":"TSLPatcher Mod","InstallationWarning":"DRAFT INSTRUCTIONS: parsed from guide prose by the natural-language importer. Review before installing - never auto-trusted.","Language":["PARTIAL - Some text will be blank or in English"],"NameFieldContent":"[High Quality Blasters](http://deadlystream.com/files/file/915-high-quality-blasters/)","WidescreenOnly":false},"canonical":{"Guid":"3eb56efe-013e-8095-80cf-a2584ba2cf94","Name":"High Quality Blasters","Author":"Sithspecter","Description":"Massively improves the appearance of almost all blaster weapons in-game without grossly altering their original design.","Directions":"","Tier":"1 - Essential","Category":["Graphics Improvement"],"IsSelected":true,"Dependencies":[],"Restrictions":[],"InstallBefore":[],"InstallAfter":[],"Instructions":[],"Options":[],"ResourceRegistry":{"http://deadlystream.com/files/file/915-high-quality-blasters/":{"Files":{},"HandlerMetadata":{}}},"DraftReview":{"RequiresReview":true,"Result":{"ComponentGuid":"3eb56efe-013e-8095-80cf-a2584ba2cf94","DraftInstructionCount":0,"UnparsedGaps":["Installation method requires observed archive contents and explicit review before its sources, destinations, exclusions, and installer choices can be bound; no actions were generated from the method or guide defaults."],"ConditionalDrafts":[],"RejectedDrafts":0},"MethodContext":{"Method":"TSLPatcher Mod","MethodTruncated":false,"Kind":"Patcher","GuideDefaults":{"PreambleStatus":"Inspected","PatcherDestination":"<<kotorDirectory>>","LooseFilesDestination":"<<kotorDirectory>>\\Override","NoOverrideOrModulesSubfolders":true},"ExplicitDirectionsTakePrecedence":true,"ArchiveBinding":"Unresolved"}},"Heading":"HQ Blasters","InstallationMethod":"TSLPatcher Mod","InstallationWarning":"DRAFT INSTRUCTIONS: parsed from guide prose by the natural-language importer. Review before installing - never auto-trusted.","Language":["PARTIAL - Some text will be blank or in English"],"NameFieldContent":"[High Quality Blasters](http://deadlystream.com/files/file/915-high-quality-blasters/)","WidescreenOnly":false}}}''')
          def stable(value):
              return (json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False)+'\n').encode('ascii')
          def sha(data): return hashlib.sha256(data).hexdigest()
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(4*1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          def write(path,value):
              data=stable(value); assert len(data)<=8*1024*1024
              path.write_bytes(data); return {'name':path.name,'sha256':sha(data),'bytes':len(data)}
          report={'schema_version':1,'status':'running','scope':'two fixed original ZIP metadata certificates only; no installation, approval or native equivalence',
              'repository':os.environ['GITHUB_REPOSITORY'],'workflow_sha':os.environ['GITHUB_SHA'],
              'source_guide_revision':'67dc5fd8da6abde324c51d32eee3d04687070dd6','source_guide_sha256':guide_sha,
              'source_plan_sha256':plan_sha,'objects':{},'canonical_json':'ASCII JSON, sorted keys, compact separators, finite values, one LF'}
          try:
              assert os.environ['ARTSTORE_REPOSITORY']==os.environ['GITHUB_REPOSITORY']=='kolto-labs/ModSync.rs'
              assert os.environ['GITHUB_REF']=='refs/heads/fix/fullrun-ci-credentials'
              plan_path=Path('tools/modsync-ci/fixtures/ci/k2-manual-plan.json')
              assert digest(plan_path)==plan_sha
              plan=json.loads(plan_path.read_text()); assert plan['guide_sha256']==guide_sha
              assert digest(Path('guide-input/content/k2/full.md'))==guide_sha
              client=artstore_client.from_environment(); index=artstore.load_index(client)
              for target in targets:
                  label=target['label']; report['stage']='fetch-'+label
                  assert plan['archive_sha256']['{archives}/'+target['filename']]==target['sha256']
                  step=plan['steps'][target['plan_index']]
                  assert step['id']==target['step'] and len(step['operations'])==3
                  extract,delete,patcher=step['operations']; slot='{extract}/'+target['step']+'/1'
                  assert extract=={'type':'extract','source':'{archives}/'+target['filename'],'destination':slot}
                  log_path=target['parent']+'/installlog.rtf'
                  assert delete=={'type':'delete','path':slot+'/'+log_path}
                  assert patcher['type']=='gui_patcher' and patcher['patcher']==slot+'/'+target['installer']
                  assert patcher['sha256']==exe_sha and patcher['cwd']==slot+'/'+target['parent']
                  assert patcher['success_log']==slot+'/'+log_path and patcher['expected_changes']=='changed_manifest'
                  owner=contexts[target['guid']]
                  for value in owner.values():
                      assert value['Guid']==target['guid'] and value['Name']==target['name']
                      assert value['InstallationMethod']=='TSLPatcher Mod' and value['WidescreenOnly'] is False
                  provenance={'target':target,'stage':'fetching','original_plan_step':step,
                      'original_raw_component':owner['raw'],'recorded_canonical_component':owner['canonical'],
                      'raw_context_source_sha256':'2a0d2edc7fd7f365d1b0c718c206bb085c870852a4ab450917e3491443b80e15',
                      'canonical_context_source_sha256':'3c23c98154f00038825e9e746b884b5937a9e80b2ea03c6a1e5b9ca7f00f6a3e',
                      'raw_component_context_sha256':sha(stable(owner['raw'])),
                      'canonical_component_context_sha256':sha(stable(owner['canonical']))}
                  report['objects'][label]=provenance
                  record=index['blobs'][target['sha256']]; assert record['size']==target['bytes']
                  provenance.update(blob=record,packs={part['pack']:index['packs'][part['pack']] for part in record['parts']})
                  path=private/(label+'.zip')
                  assert artstore.fetch(target['sha256'],path,client=client,index=index,workdir=private/'parts')
                  assert path.is_file() and not path.is_symlink() and path.stat().st_size==target['bytes']
                  assert digest(path)==target['sha256']
                  provenance['stage']='inspect'; members=[]; names=set(); file_names=set(); total=0; selected={}; ini_data=None
                  with zipfile.ZipFile(path) as archive:
                      infos=archive.infolist(); assert len(infos)==target['members']
                      for ordinal,info in enumerate(infos):
                          name=info.orig_filename
                          assert name==info.filename and name and '\x00' not in name and '\\' not in name
                          assert not name.startswith('/') and len(name)<=1024 and not any(ord(c)<32 or ord(c)==127 for c in name)
                          directory=info.is_dir(); clean=name[:-1] if directory else name
                          parts=clean.split('/')
                          assert parts and all(part not in ('','.','..') and ':' not in part for part in parts)
                          folded=clean.casefold(); assert folded not in names; names.add(folded)
                          provenance.update(stage='inspect-member',member_ordinal=ordinal,member_path=name)
                          assert not info.flag_bits & (1|64), 'encrypted member'
                          assert info.compress_type in (zipfile.ZIP_STORED,zipfile.ZIP_DEFLATED)
                          mode=info.external_attr>>16; kind=stat.S_IFMT(mode)
                          assert kind in (0,stat.S_IFREG,stat.S_IFDIR), 'special member'
                          assert not (info.external_attr & 0xffff) & (0x8|0x400), 'DOS volume or reparse member'
                          assert kind!=stat.S_IFDIR or directory
                          assert kind!=stat.S_IFREG or not directory
                          assert not (info.external_attr & 0x10) or directory
                          assert 0<=info.file_size<=32*1024*1024 and info.compress_size<=target['bytes']
                          assert not directory or info.file_size==0
                          total+=info.file_size; assert total<=64*1024*1024
                          h=hashlib.sha256(); actual=0; capture=bytearray() if name==target['ini'] else None
                          with archive.open(info) as stream:
                              while True:
                                  data=stream.read(1024*1024)
                                  if not data: break
                                  actual+=len(data); assert actual<=info.file_size
                                  h.update(data)
                                  if capture is not None: capture.extend(data)
                          assert actual==info.file_size
                          item={'ordinal':ordinal,'path':name,'directory':directory,'bytes':actual,
                              'sha256':h.hexdigest(),'crc32':info.CRC,'compressed_bytes':info.compress_size,
                              'compression':info.compress_type,'flags':info.flag_bits,'external_attributes':info.external_attr,'create_system':info.create_system}
                          members.append(item)
                          if not directory:
                              file_names.add(folded)
                              base=parts[-1].casefold()
                              assert base!='namespaces.ini' and not base.endswith('.nss')
                              if base=='changes.ini': selected.setdefault('changes',[]).append(name)
                          if name in (target['installer'],target['ini'],log_path): selected[name]=item
                          if capture is not None: ini_data=bytes(capture)
                      for member in members:
                          clean=member['path'].rstrip('/'); parts=clean.split('/')
                          assert all('/'.join(parts[:i]).casefold() not in file_names for i in range(1,len(parts))), 'file parent collision'
                  assert total==target['file_bytes'] and sum(item['directory'] for item in members)==2
                  assert selected['changes']==[target['ini']]
                  assert selected[target['installer']]['sha256']==exe_sha and selected[target['installer']]['bytes']==681984
                  assert selected[target['ini']]['sha256']==target['ini_sha256'] and selected[target['ini']]['bytes']==target['ini_bytes']
                  assert selected[log_path]['bytes']==target['log_bytes'] and ini_data is not None and b'\x00' not in ini_data
                  parser=configparser.ConfigParser(interpolation=None,strict=True,delimiters=('=',),comment_prefixes=(';',),inline_comment_prefixes=None)
                  parser.optionxform=str
                  parser.read_string(ini_data.decode('cp1252'))
                  compile_sections=[section for section in parser.sections() if section.casefold()=='compilelist']
                  assert len(compile_sections)==1 and not parser.defaults() and not list(parser.items(compile_sections[0],raw=True))
                  assert sha(ini_data)==target['ini_sha256'], 'original INI changed'
                  assert path.stat().st_size==target['bytes'] and digest(path)==target['sha256'], 'original ZIP changed'
                  inventory={'schema_version':1,'archive_sha256':target['sha256'],'archive_bytes':target['bytes'],
                      'component_guid':target['guid'],'source_order':'original ZIP central-directory order',
                      'member_count':len(members),'file_bytes':total,'members':members}
                  inventory_file=write(evidence/(label+'-inventory.json'),inventory)
                  certificate={'schema_version':1,'kind':'original-k2-log-delete-member-metadata-only','approved':False,'installed':False,
                      'target':target,'source_guide_sha256':guide_sha,'source_plan_sha256':plan_sha,
                      'inventory':inventory_file,'installer':selected[target['installer']],'changes_ini':selected[target['ini']],
                      'packaged_old_log':selected[log_path],'strict_log_delete':True,'namespace_files':0,'nss_files':0,
                      'compile_list_entries':0,'original_zip_unchanged':True,'original_ini_unchanged':True,
                      'original_plan_step':step,'original_raw_component':owner['raw'],'recorded_canonical_component':owner['canonical'],
                      'canonicalization_caveat':'Recorded context only; no application or fresh loader executed'}
                  provenance.update(stage='metadata_complete',inventory=inventory_file,certificate=write(evidence/(label+'-certificate.json'),certificate))
              report.update(status='metadata_complete',stage='complete')
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__)
              raise SystemExit('Original K2 ZIP metadata certification failed: '+type(error).__name__)
          finally:
              write(evidence/'provenance.json',report)
          PY
      - name: Retain independently encrypted metadata only
        if: success() || failure()
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/k2-log-delete-evidence
          name: k2-log-delete-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-recipient: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
