name: Inspect original K2 baseline and pinned 3C-FD candidate metadata
on:
  workflow_dispatch:
    inputs:
      engine_sha:
        description: Exact reviewed target commit containing this workflow
        required: true
        type: string
permissions: {contents: read, actions: read}
concurrency:
  group: k2-3cfd-input-metadata-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    if: github.repository == 'kolto-labs/ModSync.rs' && github.ref == 'refs/heads/fix/fullrun-ci-credentials'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ENGINE_SHA: ${{ inputs.engine_sha || github.sha }}
    steps:
      - name: Admit immutable workflow revision and encryption recipient
        env:
          RECIPIENT: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
        run: |
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ENGINE_SHA" = "$GITHUB_SHA"
          test -n "$RECIPIENT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.engine_sha || github.sha }}
          persist-credentials: false
      - name: Prepare isolated metadata tools
        timeout-minutes: 10
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/k2-3cfd-evidence" "$RUNNER_TEMP/k2-3cfd-private"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends age zstd openssl
      - name: Recover genuine target-owned K2 baseline with scoped matching credentials
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python - <<'PY' >"$RUNNER_TEMP/k2-3cfd-private/acquisition-private.log" 2>&1
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import artstore_client,fullrun_baseline
          root=Path(os.environ['RUNNER_TEMP']);evidence=root/'k2-3cfd-evidence'
          report={'status':'acquiring','repository':os.environ['GITHUB_REPOSITORY'],'engine_sha':os.environ['ENGINE_SHA']}
          try:
              assert os.environ['GITHUB_REPOSITORY']=='kolto-labs/ModSync.rs'
              result=fullrun_baseline.recover('k2',root/'k2-3cfd-sealed',root/'k2-3cfd-game',audit_backup=False)
              assert result['available'] and result['origin'].startswith('artifact:current:kolto-labs/ModSync.rs:')
              identifier=int(result['origin'].rsplit(':',1)[1])
              client=artstore_client.ArtifactsClient(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
              matches=[item for item in client.list_artifacts() if int(item['id'])==identifier]
              assert len(matches)==1 and not matches[0].get('expired',False)
              with (root/'k2-3cfd-sealed'/'baseline.seal').open('rb') as stream:sealed_sha=hashlib.file_digest(stream,'sha256').hexdigest()
              result.update(artifact=matches[0],sealed_sha256=sealed_sha)
              report.update(status='recovered',baseline=result)
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__)
              raise SystemExit('Baseline acquisition failed; inspect encrypted JSON metadata')
          finally:
              body=(json.dumps(report,indent=2)+'\n').encode();assert len(body)<=1024*1024
              (evidence/'baseline-provenance.json').write_bytes(body)
          PY
      - name: Acquire only small exact pinned public upstream source files
        timeout-minutes: 5
        run: |
          env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" python - <<'PY'
          import hashlib,json,os,time,urllib.parse,urllib.request
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);private=root/'k2-3cfd-private'/'upstream';private.mkdir(mode=0o700)
          evidence=root/'k2-3cfd-evidence'
          provenance=json.loads(r'''{"repository":"J0-o/3C-FD-Patcher","commit":"3e0db7744128ea8a47ad6a758a1ae0a9af77aa45","files":[{"path":"3cfd.ps1","bytes":47767,"sha256":"575ce1e1a4808d18ad915a4dbf4acdcfdb6f587924908da5bac83ee525c213d3"},{"path":"README.md","bytes":2382,"sha256":"7d9f4faa77dd7328bf75e3f38b882a6fa2d1df4f4cbd0030027d79904beaf860"},{"path":"metadata-kotor.json","bytes":7613,"sha256":"4c75710d22e458bce11ed5875fe0e318fecfe40d3413f6ccda31198402899377"},{"path":"metadata-kotor2.json","bytes":8453,"sha256":"f1b2b018dbbd5e8a87d659b774a9c65eeff5ae845b746fd2c72e5a282f13853b"},{"path":"patcher.ps1","bytes":11318,"sha256":"52017c7f562fe504ccdc0a684abbe1d7911f0ef1b1052d18c900927997760181"},{"path":"patches/4gb_k1.json","bytes":232,"sha256":"3970a652ebffb288084894768b8611684505ae768fb354db06c31b17041797f3"},{"path":"patches/4gb_k2.json","bytes":234,"sha256":"242998f29cfb48c96e31e57d08c3340a85b105f4f045cd910553957a10df87bf"},{"path":"patches/borderless_k1.json","bytes":276,"sha256":"13d2643051ba1a71249807555effd7d6b2d222f2ea545fe906e8e925c9f64ec9"},{"path":"patches/borderless_k2.json","bytes":283,"sha256":"e08e222286ee0f66e9339e0ff285a6ca5a5423cd8466ea892d225da453cb7cd0"},{"path":"patches/colorshift_k2.json","bytes":1808,"sha256":"a3c538548fb78181a06463ee7ca4727ad3c001ca1ccdf43ff0a24a7af2973429"},{"path":"patches/fog_reflection_fix_k2_gog.json","bytes":31509,"sha256":"e2fd4559c79e6e534b045527744c002c9b2f132f02c174113620bb38bf0c73d3"},{"path":"patches/fog_reflection_fix_k2_steam.json","bytes":31513,"sha256":"a9d31861eaf24983cb55decabfe9b529caa56ac0885996b779f967b240d44b8a"},{"path":"patches/musicfix_k2.json","bytes":285,"sha256":"553ad588abf92776aca686a83ae338ccf10fb9a2ae1d5baaca4c05e88216e6f1"},{"path":"version-signatures.json","bytes":631,"sha256":"065ab365f4a4743ce3a22df066911b6baf32c975a4bf6bdd2cfbcd631d2b8dc4"}]}''')
          assert provenance['repository']=='J0-o/3C-FD-Patcher' and provenance['commit']=='3e0db7744128ea8a47ad6a758a1ae0a9af77aa45'
          report={'status':'acquiring','repository':provenance['repository'],'commit':provenance['commit'],'files':[]}
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,request,fp,code,message,headers,newurl):
                  parsed=urllib.parse.urlsplit(newurl)
                  assert parsed.scheme=='https' and parsed.hostname=='raw.githubusercontent.com' and parsed.port in (None,443)
                  return super().redirect_request(request,fp,code,message,headers,newurl)
          opener=urllib.request.build_opener(Redirect());deadline=time.monotonic()+240;total=0
          try:
              for pin in provenance['files']:
                  assert 0<pin['bytes']<=128*1024 and time.monotonic()<deadline
                  name=pin['path'];assert name and all(part not in ('','.','..') for part in name.split('/')) and '\\' not in name
                  url='https://raw.githubusercontent.com/'+provenance['repository']+'/'+provenance['commit']+'/'+name
                  with opener.open(urllib.request.Request(url,headers={'User-Agent':'modsync-source-metadata/1'}),timeout=20) as response:
                      assert response.status==200
                      body=response.read(pin['bytes']+1)
                  assert len(body)==pin['bytes'] and hashlib.sha256(body).hexdigest()==pin['sha256']
                  total+=len(body);assert total<=256*1024
                  path=private/name;path.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
                  with path.open('xb') as output:output.write(body)
                  path.chmod(0o444);report['files'].append(pin)
              report.update(status='verified_source_only',total_bytes=total,executed=False,release_equivalence_proven=False)
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__)
              raise SystemExit('Pinned public source acquisition failed; inspect encrypted JSON metadata')
          finally:
              body=(json.dumps(report,indent=2)+'\n').encode();assert len(body)<=128*1024
              (evidence/'source-provenance.json').write_bytes(body)
          PY
      - name: Inspect original EXE and derive source-only candidates without writes
        timeout-minutes: 5
        run: |
          env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" ENGINE_SHA="$ENGINE_SHA" python - <<'PY'
          import hashlib,json,os,re,stat,struct,time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);evidence=root/'k2-3cfd-evidence';sources=root/'k2-3cfd-private'/'upstream';game=root/'k2-3cfd-game'
          report={'schema':1,'status':'inspecting','scope':'source-derived original-input metadata only; no original-tool execution or installation',
              'engine_sha':os.environ['ENGINE_SHA'],'upstream_commit':'3e0db7744128ea8a47ad6a758a1ae0a9af77aa45',
              'original_tool_witness':False,'release_equivalence_proven':False,'approved':False,'installed':False,'candidate_written_to_disk':False}
          try:
              matches=[path for path in game.iterdir() if path.name.casefold()=='swkotor2.exe']
              assert len(matches)==1;executable=matches[0]
              assert not executable.is_symlink() and executable.resolve().is_relative_to(game.resolve())
              descriptor=os.open(executable,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              with os.fdopen(descriptor,'rb') as stream:
                  before=os.fstat(stream.fileno());assert stat.S_ISREG(before.st_mode) and before.st_nlink==1 and 64<=before.st_size<=32*1024*1024
                  data=stream.read(32*1024*1024+1);after=os.fstat(stream.fileno())
                  assert len(data)==before.st_size and (before.st_size,before.st_mtime_ns,before.st_ctime_ns)==(after.st_size,after.st_mtime_ns,after.st_ctime_ns)
              sha=lambda value:hashlib.sha256(value).hexdigest()
              input_sha=sha(data)
              report.update(filename=executable.name,bytes=len(data),sha256=input_sha,
                  matches_known_aspyr_baseline=(len(data)==6588416 and input_sha=='6a522e71631dcee93467bd2010f3b23d9145326e1e2e89305f13ab104dbbffef'))
              def u16(offset):assert 0<=offset<=len(data)-2;return struct.unpack_from('<H',data,offset)[0]
              def u32(offset):assert 0<=offset<=len(data)-4;return struct.unpack_from('<I',data,offset)[0]
              assert data[:2]==b'MZ';pe=u32(0x3c);assert 64<=pe<=len(data)-24 and data[pe:pe+4]==b'PE\0\0'
              machine=u16(pe+4);characteristics=u16(pe+22);optional=pe+24;optional_bytes=u16(pe+20);sections=u16(pe+6)
              assert 1<=sections<=96 and optional_bytes>=96 and optional+optional_bytes+sections*40<=len(data)
              magic=u16(optional)
              report['pe']={'offset':pe,'machine':machine,'optional_magic':magic,'optional_header_bytes':optional_bytes,'sections':sections,
                  'coff_characteristics':characteristics,'coff_characteristics_offset':pe+22,'large_address_aware':bool(characteristics&0x20),
                  'executable_image':bool(characteristics&2),'dll':bool(characteristics&0x2000),'checksum':u32(optional+64)}
              assert machine==0x14c and magic==0x10b and characteristics&2 and not characteristics&0x2000
              source_report=json.loads((evidence/'source-provenance.json').read_text());assert source_report['status']=='verified_source_only'
              for pin in source_report['files']:
                  path=sources/pin['path'];assert not path.is_symlink() and path.is_file() and path.stat().st_size==pin['bytes']
                  assert sha(path.read_bytes())==pin['sha256']
              signatures=json.loads((sources/'version-signatures.json').read_text(encoding='utf-8-sig'))['signatures']
              signatures=[entry for entry in signatures if entry['game']=='kotor2'];assert len(signatures)==2
              observations=[]
              for entry in signatures:
                  pattern=bytes.fromhex(entry['hex']);assert entry['offset']==4096 and len(pattern)==16 and len(data)>=4112
                  observations.append({'name':entry['name'],'offset':4096,'bytes':16,'expected_signature_sha256':sha(pattern),
                      'expected_signature_hex':pattern.hex(),'observed_signature_sha256':sha(data[4096:4112]),'matches':data[4096:4112]==pattern})
              report['version_signatures']=observations
              vendors=[entry['name'] for entry in observations if entry['matches']]
              assert len(vendors)==1, 'exact vendor signature is not unique'
              vendor={'KOTOR 2 Steam':'steam','KOTOR 2 GOG':'gog'}[vendors[0]]
              selected=['4gb_k2.json','colorshift_k2.json','fog_reflection_fix_k2_'+vendor+'.json','musicfix_k2.json']
              assert selected==sorted(selected)
              report.update(selected_vendor=vendor,selected_files=selected,excluded_files=['borderless_k1.json','borderless_k2.json','4gb_k1.json','fog_reflection_fix_k2_'+('gog' if vendor=='steam' else 'steam')+'.json'])
              deadline=time.monotonic()+180;operations=[];block_reports=[]
              def observations_of(pattern):
                  count=0;first=None;offset=0
                  while True:
                      assert time.monotonic()<deadline
                      found=data.find(pattern,offset)
                      if found<0:break
                      count+=1
                      if first is None:first=found
                      offset=found+1
                  return {'count':count,'first_offset':first}
              for filename in selected:
                  patch=json.loads((sources/'patches'/filename).read_text(encoding='utf-8-sig'))
                  assert len(patch['blocks'])==(6 if filename.startswith('fog_') else 1)
                  for index,block in enumerate(patch['blocks']):
                      assert set(block)=={'find','replace'}
                      assert re.fullmatch(r'[0-9A-Fa-f\s]+',block['find']) and re.fullmatch(r'[0-9A-Fa-f\s]+',block['replace'])
                      original=bytes.fromhex(block['find']);replacement=bytes.fromhex(block['replace']);assert 0<len(original)==len(replacement)<=2048
                      found=observations_of(original);patched=observations_of(replacement)
                      item={'file':filename,'block':index,'bytes':len(original),'find_sha256':sha(original),'replacement_sha256':sha(replacement),
                          'original_pattern':found,'replacement_pattern':patched};block_reports.append(item)
                      if found['first_offset'] is not None:operations.append((filename,index,found['first_offset'],original,replacement))
              assert len(block_reports)==9 and [entry['bytes'] for entry in block_reports]==[5,266,276,1094,344,1462,459,1462,8]
              report['blocks']=block_reports
              overlaps=[]
              for index,left in enumerate(operations):
                  for other,right in enumerate(operations[:index]):
                      begin=max(left[2],right[2]);end=min(left[2]+len(left[3]),right[2]+len(right[3]))
                      if begin<end:overlaps.append({'operations':[other,index],'start':begin,'end_exclusive':end,'bytes':end-begin})
              report['overlaps']=overlaps
              report['all_original_patterns_present']=len(operations)==9
              report['all_original_patterns_unique']=all(entry['original_pattern']['count']==1 for entry in block_reports)
              if len(operations)==9:
                  # Match pinned GUI semantics: derive every first match from the
                  # same ORIGINAL buffer, then apply in filename/block order.
                  candidate=bytearray(data);stages=[]
                  for filename,index,offset,original,replacement in operations:
                      assert data[offset:offset+len(original)]==original
                      candidate[offset:offset+len(replacement)]=replacement
                      stages.append({'file':filename,'block':index,'offset':offset,'bytes':len(replacement),'cumulative_sha256':sha(candidate)})
                  changed=[index for index,(old,new) in enumerate(zip(data,candidate)) if old!=new]
                  assert len(candidate)==len(data) and len(changed)<=sum(len(op[3]) for op in operations)
                  ranges=[]
                  for offset in changed:
                      if ranges and ranges[-1]['end_exclusive']==offset:ranges[-1]['end_exclusive']+=1
                      else:ranges.append({'start':offset,'end_exclusive':offset+1})
                  assert len(ranges)<=8192
                  report['candidate']={'available':True,'algorithm':'original-buffer first-match operations, sorted filename then original block order',
                      'sha256':sha(candidate),'bytes':len(candidate),'changed_bytes':len(changed),'first_changed_offset':changed[0] if changed else None,
                      'last_changed_offset':changed[-1] if changed else None,'changed_ranges':ranges,'operations':stages,
                      'narrow_unambiguous_nonoverlap_input':report['all_original_patterns_unique'] and not overlaps and not bool(characteristics&0x20),
                      'written_to_disk':False,'original_tool_equivalence':False}
              else:
                  report['candidate']={'available':False,'reason':'one or more original patterns absent; no partial candidate admitted','written_to_disk':False}
              with executable.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==input_sha
              final_info=executable.stat();assert (before.st_size,before.st_mtime_ns,before.st_ctime_ns)==(final_info.st_size,final_info.st_mtime_ns,final_info.st_ctime_ns)
              report.update(status='metadata_complete',original_executable_unchanged=True)
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__)
              raise SystemExit('K2 3C-FD input inspection failed; inspect encrypted JSON metadata')
          finally:
              body=(json.dumps(report,indent=2)+'\n').encode();assert len(body)<=2*1024*1024
              (evidence/'input-metadata.json').write_bytes(body)
          PY
      - name: Admit bounded JSON-only evidence
        if: success() || failure()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'k2-3cfd-evidence';total=0
          for path in root.iterdir():
              assert path.is_file() and not path.is_symlink() and path.suffix=='.json'
              size=path.stat().st_size;assert size<=2*1024*1024;total+=size
              json.loads(path.read_text())
          assert total<=4*1024*1024
          PY
      - name: Retain independently encrypted metadata only
        if: success() || failure()
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/k2-3cfd-evidence
          name: k2-3cfd-input-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-recipient: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
