name: Compare real patcher installations against the packaged patcher
on:
  workflow_call:
    inputs:
      game: {type: string, required: true}
      # JSON list of installed routes, e.g. '["cli","gui"]' or '["cli"]'.
      modes: {type: string, default: '["cli","gui"]'}
    secrets:
      CACHE_ENCRYPTION_KEY: {required: true}
      DIAGNOSTICS_ENCRYPTION_KEY: {required: false}
permissions: {contents: read, actions: read}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout owned comparison implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reserve space for complete checkpoint manifests
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
      - name: Verify same-run provenance and compare every component and final tree
        env:
          GAME: ${{ inputs.game }}
          MODES: ${{ join(fromJSON(inputs.modes), ',') }}
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          umask 077
          python tools/modsync-ci/patcher_comparison_artifacts.py --game "$GAME" --modes "$MODES" \
            --work-dir "$RUNNER_TEMP/comparison-inputs" --output-dir "$RUNNER_TEMP/comparison-evidence"
      - name: Retain complete encrypted file differences
        if: ${{ success() || failure() }}
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/comparison-evidence
          name: fullrun-comparison-${{ inputs.game }}-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-key: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
          encryption-recipient: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
