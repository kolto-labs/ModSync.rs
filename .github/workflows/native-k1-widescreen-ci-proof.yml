name: Prove four focused native K1 widescreen owners
on:
  push:
    branches: [fix/fullrun-ci-credentials]
    paths: [.github/workflows/native-k1-widescreen-ci-proof.yml]
  workflow_dispatch:
    inputs:
      feature_sha:
        description: Exact reviewed feature commit (must equal the dispatched workflow SHA)
        required: true
        type: string
permissions: {contents: read, actions: read}
concurrency:
  group: native-k1-widescreen-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    if: github.repository == 'kolto-labs/ModSync.rs' && github.ref == 'refs/heads/fix/fullrun-ci-credentials'
    strategy:
      fail-fast: false
      matrix: {mode: [cli, gui]}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      MODE: ${{ matrix.mode }}
      FEATURE_SHA: ${{ inputs.feature_sha || github.sha }}
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Admit exact immutable workflow and feature revision
        env:
          DIAGNOSTICS_RECIPIENT: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
        run: |
          [[ "$FEATURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$FEATURE_SHA" = "$GITHUB_SHA"
          test -n "$DIAGNOSTICS_RECIPIENT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.feature_sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kolto-labs/mod-builds
          ref: 67dc5fd8da6abde324c51d32eee3d04687070dd6
          path: guide-input
          persist-credentials: false
      - name: Prepare exact six-public-input cache identity
        id: k1-public-key
        run: |
          python - <<'PYKEY'
          import hashlib,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import k1_widescreen_inputs as inputs
          guide=Path('guide-input/content/k1/full.md')
          assert not guide.is_symlink() and guide.is_file()
          assert hashlib.sha256(guide.read_bytes()).hexdigest()==inputs.GUIDE_SHA256
          identity='k1-widescreen-public-v1-'+inputs.PROFILE_SHA256+'-'+inputs.GALAXY_PROFILE_SHA256
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('key='+identity+'\n')
          PYKEY
      - name: Restore exact six-public-input accelerator
        id: k1-public-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache/k1-widescreen-inputs
          key: ${{ steps.k1-public-key.outputs.key }}
      - name: Prepare disposable native runtime and real X11 input
        timeout-minutes: 15
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/k1-focused-evidence"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends age xvfb xauth xdotool pkg-config libssl-dev zstd openssl python3-tk tesseract-ocr libxkbcommon-x11-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev scrot
          python -m pip install PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
          rustup toolchain install 1.95.0 --profile minimal
      - name: Acquire six fixed public native inputs with production helper
        id: public-inputs
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_TOKEN: ${{ github.token }}
          ARTSTORE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import k1_widescreen_inputs
          assert os.environ['ARTSTORE_REPOSITORY']==os.environ['GITHUB_REPOSITORY']=='kolto-labs/ModSync.rs'
          root=Path(os.environ['RUNNER_TEMP'])
          result=k1_widescreen_inputs.ensure(root/'archives',root/'mod-cache',root/'k1-focused-evidence'/'public-input-provenance.json')
          assert result['ok'] is True and len(result['entries'])==6
          auxiliary=root/'mod-cache'/'k1-widescreen-inputs'
          expected={entry['sha256']:entry['bytes'] for entry in result['entries']}
          assert len(expected)==6 and {path.name for path in auxiliary.iterdir()}=={'objects'}
          objects=auxiliary/'objects'; assert objects.is_dir() and not objects.is_symlink()
          assert {path.name for path in objects.iterdir()}==set(expected)
          for path in objects.iterdir():
              assert path.is_file() and not path.is_symlink() and path.stat().st_size==expected[path.name]
          PY
      - name: Save verified six-public-input accelerator before application build
        if: ${{ steps.public-inputs.outcome == 'success' && steps.k1-public-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache/k1-widescreen-inputs
          key: ${{ steps.k1-public-key.outputs.key }}
      - name: Build production application with no acquisition credentials
        timeout-minutes: 40
        run: |
          flags=()
          if [[ "$MODE" == cli ]]; then flags+=(--no-default-features); fi
          env -i PATH="$PATH" HOME="$HOME" RUSTUP_TOOLCHAIN=1.95.0 \
            CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true \
            cargo build --locked --release --lib --bin modsync -j2 "${flags[@]}" \
            >"$RUNNER_TEMP/k1-focused-evidence/build.log" 2>&1
      - name: Recover genuine pristine K1 and exact predecessor from owned artifacts
        timeout-minutes: 35
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_TOKEN: ${{ github.token }}
          ARTSTORE_REPOSITORY: ${{ github.repository }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import artstore,artstore_client,fullrun_baseline
          root=Path(os.environ['RUNNER_TEMP']); evidence=root/'k1-focused-evidence'
          assert os.environ['ARTSTORE_REPOSITORY']==os.environ['GITHUB_REPOSITORY']=='kolto-labs/ModSync.rs'
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(4*1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          report={'status':'acquiring','scope':'reduced four-owner diagnostic; not full-guide or merge coverage'}
          try:
              result=fullrun_baseline.recover('k1',root/'sealed',root/'game',audit_backup=False)
              assert result['available'] and result['origin'].startswith('artifact:current:kolto-labs/ModSync.rs:')
              client=artstore_client.from_environment(); index=artstore.load_index(client)
              artifact_id=int(result['origin'].rsplit(':',1)[1])
              matches=[item for item in client.list_artifacts() if int(item['id'])==artifact_id]
              assert len(matches)==1 and not matches[0].get('expired',False)
              result.update(baseline_artifact=matches[0],sealed_sha256=digest(root/'sealed'/'baseline.seal'))
              report['baseline']=result
              book_path=Path('src/archive_generation/reviewed_manual_k1.json')
              assert digest(book_path)=='b04b7331b5001f81698feb5571460ea9e2e486d032956abb22967d704254c338'
              recipe=next(item for item in json.loads(book_path.read_text())['recipes'] if item['component_guid']=='a3670a2f-f382-86e0-9696-020080fb3a43')
              assert recipe['source_component_index']==0 and recipe['archives']
              archives=root/'archives'; archives.mkdir(mode=0o700,exist_ok=True)
              material=[]; packs={}
              for pin in recipe['archives']:
                  assert Path(pin['filename']).name==pin['filename']
                  record=index['blobs'][pin['sha256']]
                  assert 0<record['size']<=256*1024*1024
                  destination=archives/pin['filename']
                  assert artstore.fetch(pin['sha256'],destination,client=client,index=index,workdir=root/'parts')
                  assert destination.is_file() and not destination.is_symlink()
                  assert destination.stat().st_size==record['size'] and digest(destination)==pin['sha256']
                  material.append({**pin,'blob':record})
                  packs.update({part['pack']:index['packs'][part['pack']] for part in record['parts']})
              report.update(status='acquired',predecessor_materials=material,packs=packs)
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__); raise
          finally:
              (evidence/'material-provenance.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Bind, independently review and execute actual Base then Remaining
        timeout-minutes: 65
        run: |
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" MODE="$MODE" FEATURE_SHA="$FEATURE_SHA" \
            python - <<'PY'
          import contextlib,copy,hashlib,json,os,shutil,subprocess,sys,time,tomllib
          from pathlib import Path
          from types import SimpleNamespace
          sys.path.insert(0,'tools/modsync-ci')
          import gui_rust
          root=Path(os.environ['RUNNER_TEMP']); evidence=root/'k1-focused-evidence'
          private=root/'k1-focused-model'; private.mkdir(mode=0o700)
          binary=Path('target/release/modsync').resolve(); game=root/'game'; archives=root/'archives'
          guide=Path('guide-input/content/k1/full.md')
          expected=['a3670a2f-f382-86e0-9696-020080fb3a43','6c3c7165-297e-80eb-b9f8-d47506dab2d5','7c11497d-de47-8eee-b80a-967b984a2822','267b10d2-bab0-8e3a-a258-f9b6d6f9d71b']
          report={'status':'running','mode':os.environ['MODE'],'engine_sha':os.environ['FEATURE_SHA'],
              'scope':'four original owners only; independent pristine baseline; not full-guide, merge, or cross-lane byte equivalence','stages':[]}
          def save(): (evidence/'native-proof.json').write_text(json.dumps(report,indent=2))
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(4*1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          def run(label,command,timeout=1800,structured=False):
              start=time.monotonic()
              with contextlib.ExitStack() as stack:
                  log=stack.enter_context((evidence/(label+'.log')).open('wb'))
                  stderr=stack.enter_context((evidence/(label+'-stderr.log')).open('wb')) if structured else subprocess.STDOUT
                  result=subprocess.run(list(map(str,command)),stdin=subprocess.DEVNULL,stdout=log,stderr=stderr,timeout=timeout)
              report['stages'].append({'name':label,'exit_code':result.returncode,'seconds':time.monotonic()-start}); save()
              assert result.returncode==0,label
          def document(path):
              value=json.loads(path.read_text())
              assert isinstance(value,dict) and len(value['thisMod'])==197
              assert value['ModSyncSourceOrder']==inventory
              assert [c['Guid'] for c in value['thisMod']]==inventory
              return value
          def manifest():
              files={}
              for path in sorted(game.rglob('*')):
                  assert not path.is_symlink()
                  if path.is_file(): files[str(path.relative_to(game))]=digest(path)
              assert files
              return files
          state=game.parent/('.modsync-'+hashlib.sha256(os.fsencode(str(game))).hexdigest()[:16])
          def receipt(ids,label):
              verified={}
              gui_rust.verify_receipt(SimpleNamespace(game_dir=game,archives=archives),verified,lambda:None,ids)
              path=state/'completion.json'; completion=json.loads(path.read_text())
              assert [c['Guid'].lower() for c in completion['components']]==ids
              checkpoint=completion['installReport']['checkpoint']
              assert checkpoint['sessionId'] and checkpoint['checkpointId'] and checkpoint['generation']>0
              assert not (state/'external-writers-v1.json').exists()
              assert not list((state/'checkpoints-v1'/'operations').glob('*.json'))
              shutil.copyfile(path,evidence/(label+'-completion.json'))
              return {'verified':verified,'checkpoint':checkpoint}
          try:
              assert digest(guide)=='44067788c6cb7a83b38d468817f273ce5cc901cd5e000c0f9ff65f8af15fc6ed'
              profile_path=Path('src/k1_widescreen_profile.json')
              assert digest(profile_path)=='5828e338a0f06e65f5ff9b0a019f64221d7090ad40d6362f397f5905609ad2e4'
              profile=json.loads(profile_path.read_text())
              report.update(binary_sha256=digest(binary),guide_sha256=digest(guide),profile_sha256=digest(profile_path))
              shutil.copyfile(guide,evidence/'original-source-guide.md')
              run('normalize-baseline',[sys.executable,'tools/modsync-ci/game_cache.py','normalize-case','--game','k1','--game-dir',game,'--label','focused-native-k1'])
              before=manifest(); (evidence/'whole-game-before-manifest.json').write_text(json.dumps(before,indent=2))
              assert not any(name.lower()=='swkotor.ini' for name in before)
              report['baseline_ini_absent']=True
              report['baseline_executable_sha256']=digest(game/'swkotor.exe')
              assert (game/'swkotor.exe').stat().st_size==4395008
              assert report['baseline_executable_sha256']=='34e6d971c034222a417995d8e1e8fdd9f8781795c9c289bd86c499a439f34c88'
              original=private/'original.toml'; selected=private/'selected.toml'; pending=private/'pending.toml'; reviewed=private/'reviewed.toml'
              run('original-convert',[binary,'convert',guide,original,'--format','toml','--parse-directions'])
              source=tomllib.loads(original.read_text()); assert len(source['thisMod'])==197
              inventory=[c['Guid'] for c in source['thisMod']]
              assert len(set(inventory))==197 and inventory[0]==expected[0] and set(expected)<=set(inventory)
              (evidence/'original-inventory.json').write_text(json.dumps({'guids':inventory,'selected_execution':expected,
                  'original_indices':{guid:inventory.index(guid) for guid in expected},'full_component_count':197},indent=2))
              selection=[guid in expected for guid in inventory]
              assert sum(selection)==4
              text=original.read_text()
              assert 'ModSyncSourceOrder' not in source
              selected.write_text('ModSyncSourceOrder = '+json.dumps(inventory)+'\n\n'+gui_rust.rewrite_selection(text,selection))
              original_json=private/'selected.json'
              run('selected-canonical-export',[binary,'convert',selected,original_json,'--format','json'])
              canonical=document(original_json)
              book_path=Path('src/archive_generation/reviewed_manual_k1.json')
              assert digest(book_path)=='b04b7331b5001f81698feb5571460ea9e2e486d032956abb22967d704254c338'
              recipe=next(item for item in json.loads(book_path.read_text())['recipes'] if item['component_guid']==expected[0])
              assert len(recipe['archives'])==1
              pin=recipe['archives'][0]; path=archives/pin['filename']
              assert digest(path)==pin['sha256']
              resolved=private/'predecessor-resolved.json'
              resolved.write_text(json.dumps([{'componentGuid':expected[0],'filenames':[pin['filename']],
                  'sha256':pin['sha256'],'sizeBytes':path.stat().st_size}],indent=2))
              run('atomic-native-bind',[binary,'convert',selected,pending,'--format','toml','--source-path',archives,
                  '--k1-widescreen-profile',profile['profile'],'--k1-source-guide',guide,'--k1-galaxy-namespace','Vanilla','--resolved-archives',resolved,'--compact-instruction-defaults'])
              run('independent-replay',[binary,'convert',pending,reviewed,'--format','toml','--source-path',archives,'--review-verified-drafts','--compact-instruction-defaults'])
              final_json=private/'reviewed.json'
              run('reviewed-canonical-export',[binary,'convert',reviewed,final_json,'--format','json'])
              final=document(final_json); components=final['thisMod']
              assert final['K1WidescreenSchedule']['OriginalSourceOrder']==inventory
              assert final['K1WidescreenSchedule']['GalaxyChoice']=='Vanilla'
              assert sum(c['IsSelected'] is True for c in components)==4
              for original_component,component in zip(canonical['thisMod'],components):
                  guid=component['Guid']; assert component['IsSelected']==(guid in expected)
                  assert component.get('WidescreenOnly')==original_component.get('WidescreenOnly')
                  if guid not in expected:
                      assert component==original_component, 'unselected source definition changed: '+guid
                      assert component['DraftReview']['RequiresReview'] is True
                  else:
                      assert component['DraftReview']['RequiresReview'] is False
                      for key in ('Guid','Name','Author','Description','Directions','WidescreenOnly'):
                          assert component.get(key)==original_component.get(key)
                      if guid==expected[0]:
                          binding=component['AuthoredRecipeBinding']
                          assert binding['Recipe']==recipe
                          assert binding['DatabookSha256']=='b04b7331b5001f81698feb5571460ea9e2e486d032956abb22967d704254c338'
                      if guid in expected[1:]:
                          assert [step['Action'] for step in component['Instructions']]==['K1Widescreen']
                          assert component['K1WidescreenBinding']
                      run('review-'+guid,[binary,'guide-draft-review',reviewed,guid],structured=True)
                      control=json.loads((evidence/('review-'+guid+'.log')).read_text())
                      assert control['requiresReview'] is False
              report['selected_reviews']={c['Guid']:c['DraftReview'] for c in components if c['Guid'] in expected}
              report['schedule']=final['K1WidescreenSchedule']
              run('phase-plan',[binary,'phase-plan',reviewed],structured=True)
              plan=json.loads((evidence/'phase-plan.log').read_text())
              assert plan['installed'] is False and plan['execution_order']==expected
              assert plan['base']==expected[:1] and plan['remaining']==expected[1:]
              arguments=['--input',reviewed,'--game-dir',game,'--source-dir',archives,'--use-file-selection','--non-interactive']
              if os.environ['MODE']=='cli':
                  run('validate-base',[binary,'validate',*arguments,'--phase','base'])
                  assert manifest()==before, 'validation changed baseline'
                  run('install-base',[binary,'install',*arguments,'--phase','base','--component-checkpoints'])
                  report['base']=receipt(expected[:1],'base'); save()
                  base_manifest=manifest()
                  run('validate-remaining',[binary,'validate',*arguments,'--phase','remaining'])
                  assert manifest()==base_manifest, 'validation changed base result'
                  run('install-remaining',[binary,'install',*arguments,'--phase','remaining'])
                  outcome_logs=[evidence/'install-remaining.log']
              else:
                  deselect=[item for guid in inventory if guid not in expected for item in ('--deselect',guid)]
                  assert len(deselect)==386
                  run('actual-desktop',[sys.executable,'tools/modsync-ci/gui_rust.py','--binary',binary,'--input',reviewed,
                      '--game-dir',game,'--archives',archives,'--work-dir',root/'gui-work','--report',evidence/'gui-report.json',
                      '--timeout','3000','--complete-guide',*deselect],3100)
                  desktop=json.loads((evidence/'gui-report.json').read_text())
                  assert desktop['status']=='installed' and desktop['ui_completed'] is True
                  assert desktop['phase_oracle']['status']=='matched'
                  phases=desktop['phases']; assert [p['phase'] for p in phases]==['base','remaining']
                  for phase,ids,cumulative in zip(phases,(expected[:1],expected[1:]),(expected[:1],expected)):
                      assert phase['expected_guids']==sorted(ids) and phase['completed_guids']==sorted(cumulative)
                      assert phase['ui_completed'] and phase['validation_passed'] and phase['snapshot_confirmed']
                  report['desktop_phases']=phases
                  settings=list((root/'gui-work').glob('gui-rust-*/settings')); assert len(settings)==1
                  outcome_logs=sorted((settings[0]/'Logs').glob('kotormodsync_*.log'))
                  assert 0<len(outcome_logs)<=8
              report['final']=receipt(expected,'final')
              after=manifest(); assert after!=before
              (evidence/'whole-game-after-manifest.json').write_text(json.dumps(after,indent=2))
              assert (game/'swkotor.exe').stat().st_size==4042752
              assert digest(game/'swkotor.exe')=='d739e41e79f89ee98e666f66deb22a8f85da5b44908c4e9fcfcb24fea723f959'
              ini=game/'swkotor.ini'; assert ini.stat().st_size==91
              assert digest(ini)=='6dff4a2a50e5527ab31021084dc9f0032dcf414ac72f9fc779de71beb47102ce'
              data=ini.read_bytes(); assert b'\r\n' in data and b'\n' not in data.replace(b'\r\n',b'')
              hrmenus=[asset for asset in profile['assets'] if asset['archive']=='hrmenus' and asset['path'].startswith('16-by-9/gui.1920x1080/') and asset['path'].endswith('.gui')]
              assert len(hrmenus)==81
              galaxy=next(asset for asset in profile['assets'] if asset['archive']=='galaxy' and asset['path'].endswith('/galaxymap.gui'))
              assert galaxy['bytes']==17933 and galaxy['sha256']=='054ab565204f56337b7caab20789176246da39406edc981d6ff4a0400ad5d09a'
              actual_paths={name.casefold():game/name for name in after}
              assert len(actual_paths)==len(after)
              for asset in hrmenus:
                  pin=galaxy if Path(asset['path']).name=='galaxymap.gui' else asset
                  path=actual_paths['override/'+Path(asset['path']).name.casefold()]
                  assert path.stat().st_size==pin['bytes'] and digest(path)==pin['sha256']
              assert digest(actual_paths['override/galaxymap.gui'])==galaxy['sha256']
              candidates={}; installed_galaxy={}
              markers=('K1 deterministic candidate publication: ','K1 whole Galaxy Vanilla base then 1920 overlay: ')
              for index,path in enumerate(outcome_logs):
                  assert not path.is_symlink() and path.is_file() and path.stat().st_size<=64*1024*1024
                  for line in path.read_text(errors='strict').splitlines():
                      for marker in markers:
                          if marker not in line: continue
                          payload=line.split(marker,1)[1]; value,end=json.JSONDecoder().raw_decode(payload)
                          if marker==markers[0]:
                              role=value['Role']
                              assert value['ProfileSha256']==report['profile_sha256']
                              if role in candidates: assert candidates[role]==value
                              candidates[role]=value
                          elif value['Installed'] is True:
                              assert value['WholeComponent'] is True and value['NativeBaseRunsInPrivateProjection'] is True
                              installed_galaxy[payload[:end]]=value
                  if os.environ['MODE']=='gui': shutil.copyfile(path,evidence/('desktop-application-'+str(index)+'.log'))
              assert set(candidates)=={'hrmenus','galaxy-overlay-after-strict-whole-base','fourgb'}
              assert len(installed_galaxy)==1
              whole=next(iter(installed_galaxy.values())); outcome=whole['NativeOutcome']
              admission=whole['Input']
              assert admission['Kind']=='GalaxyVanillaInputAdmissionOnly'
              assert admission['ProfileSha256']=='76794533372b440b9b804a3afac5a3909e1e323da3479bab165ffdfe664167b7'
              assert admission['ExplicitNamespaceId']=='Vanilla' and admission['NamespaceIndex']==0
              assert admission['BuiltinBackendRequired'] is True
              assert admission['NativeOutcomeContract']=='native-zero-warnings-changed-game-v1'
              assert outcome['Contract']=='native-zero-warnings-changed-game-v1'
              assert outcome['Failed']==outcome['Warnings']==outcome['Errors']==0
              assert outcome['Added']+outcome['Removed']+outcome['Changed']>0
              assert outcome['BeforeManifestSha256']!=outcome['AfterManifestSha256']
              assert 0<outcome['LogBytes']<=8*1024*1024 and len(outcome['LogSha256'])==64
              report.update(status='installed',selected_execution=expected,whole_galaxy=whole,candidate_receipts=candidates,
                  hrmenu_gui_count=81,changed_game_files=sum(before.get(k)!=after.get(k) for k in set(before)|set(after)))
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__); raise
          finally:
              # Only bounded metadata/logs: no game payload, INI, EXE, archive, image,
              # desktop screenshots, checkpoint blobs, snapshot trees or prefix.
              paths=[state/'external-writers-v1.json',state/'checkpoints-v1'/'active.json']
              paths+=sorted((state/'checkpoints-v1'/'operations').glob('*.json'))[:16]
              for index,path in enumerate(paths):
                  if path.is_symlink() or not path.is_file() or path.stat().st_size>4*1024*1024: continue
                  if path.resolve().is_relative_to(state.resolve()): shutil.copyfile(path,evidence/('checkpoint-'+str(index)+'-'+path.name))
              gui_root=root/'gui-work'; total=0
              if gui_root.is_dir():
                  for index,path in enumerate(sorted(gui_root.rglob('*'))):
                      if path.is_symlink() or not path.is_file() or path.suffix not in ('.log','.json'): continue
                      if not path.resolve().is_relative_to(gui_root.resolve()): continue
                      size=path.stat().st_size
                      if size>8*1024*1024 or total+size>48*1024*1024: continue
                      shutil.copyfile(path,evidence/('desktop-metadata-'+str(index)+'-'+path.name)); total+=size
              save()
          PY
      - name: Bound the metadata and log allowlist even on failure
        if: success() || failure()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'k1-focused-evidence'
          root.mkdir(mode=0o700,exist_ok=True)
          receipt=[]; total=0
          for path in sorted(root.iterdir()):
              assert not path.is_symlink() and path.is_file()
              assert path.suffix in ('.log','.json','.md'), 'unexpected evidence type'
              size=path.stat().st_size
              if path.suffix=='.log' and size>8*1024*1024:
                  with path.open('rb') as stream:
                      stream.seek(-8*1024*1024,2); tail=stream.read()
                  path.write_bytes(b'[bounded log tail; original bytes='+str(size).encode()+b']\n'+tail)
              elif size>16*1024*1024:
                  # Keep a bounded failure diagnosis rather than oversized metadata.
                  path.write_text(json.dumps({'retention':'oversized metadata omitted','original_bytes':size}))
              size=path.stat().st_size; total+=size
              assert total<=192*1024*1024, 'evidence aggregate exceeds bound'
              receipt.append({'name':path.name,'bytes':size})
          (root/'retention-allowlist.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Retain independently encrypted focused metadata and failure diagnostics
        if: success() || failure()
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/k1-focused-evidence
          name: native-k1-widescreen-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-recipient: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
