name: Synthetic full guides GUI (linux)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner or ephemeral session runner
        type: choice
        options: [hosted, session]
        default: hosted
      guides_ref:
        description: Exact kolto-labs/mod-builds commit
        type: string
        required: true
        default: 21b2f0499d28ecd4ee2092701dee5792ba5da4b9
permissions:
  contents: read
jobs:
  native-clickthrough:
    runs-on: ${{ inputs.runner == 'session' && fromJSON('["self-hosted", "Linux", "modsync-session"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      LIBGL_ALWAYS_SOFTWARE: '1'
      GUIDES_SHA: ${{ inputs.guides_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kolto-labs/mod-builds
          ref: ${{ inputs.guides_ref }}
          path: guide-input
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.runner != 'session'
        with:
          python-version: '3.12'
      - name: Install native desktop dependencies
        if: inputs.runner != 'session'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth scrot tesseract-ocr python3-tk python3-dev pkg-config libssl-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev
      - name: Install actual desktop input and OCR libraries
        if: inputs.runner != 'session'
        run: python -m pip install pyautogui==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
      - name: Install production Rust toolchain
        if: inputs.runner != 'session'
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        if: inputs.runner != 'session'
      - name: Connect ephemeral session build and native runtime
        if: inputs.runner == 'session'
        shell: bash
        run: |
          test -n "$GUIVENV"
          test -n "$ENV_GUI_RUNTIME"
          test -d /workspace/ModSync.rs/target
          test ! -e target
          ln -s /workspace/ModSync.rs/target target
          echo "$GUIVENV/bin" >> "$GITHUB_PATH"
          echo "$ENV_GUI_RUNTIME/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$ENV_GUI_RUNTIME/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Build production desktop only
        shell: bash
        run: cargo +1.95.0 build --locked --lib --bin modsync -j2
      - name: Record source and guide pins
        shell: bash
        run: |
          [[ "$GUIDES_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C guide-input rev-parse HEAD)" = "$GUIDES_SHA"
          mkdir -p proof
          git rev-parse HEAD > proof/source-commit.txt
          git -C guide-input rev-parse HEAD > proof/guide-commit.txt
      - name: K1 native GUI validation and install clickthrough
        shell: bash
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" python tools/prove_synthetic_gui.py --binary target/debug/modsync --guides guide-input --game k1 --output proof/k1
      - name: TSL native GUI validation and install clickthrough
        if: always()
        shell: bash
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" python tools/prove_synthetic_gui.py --binary target/debug/modsync --guides guide-input --game k2 --output proof/k2
      - name: Retain screenshots, input actions, coverage and byte receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: synthetic-gui-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          retention-days: 14
          if-no-files-found: error
