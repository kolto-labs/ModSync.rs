name: Manual package artifacts (unverified)
# Builds and packages one commit for every target, smoke-tests each packaged binary on
# its native runner, and keeps the results as workflow artifacts. It holds no
# publication permissions itself; release.yml calls it and publishes what it builds.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact clean source commit (40 hex digits)
        required: true
        type: string
      version:
        description: Package version (three decimal components)
        required: true
        type: string
      windows_icon:
        description: Tracked native ICO path; see packaging/assets/PROVENANCE.md
        default: packaging/assets/modsync.ico
        type: string
      macos_icon:
        description: Tracked native ICNS path; see packaging/assets/PROVENANCE.md
        default: packaging/assets/modsync.icns
        type: string
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      windows_icon:
        default: packaging/assets/modsync.ico
        type: string
      macos_icon:
        default: packaging/assets/modsync.icns
        type: string
permissions:
  contents: read
concurrency:
  group: package-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, os: linux }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, os: linux }
          - { runner: windows-2025, target: i686-pc-windows-msvc, os: windows }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, os: windows }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, os: windows }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, os: macos }
          - { runner: macos-15, target: aarch64-apple-darwin, os: macos }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.head_sha }}
      PACKAGE_VERSION: ${{ inputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
      TARGET_OS: ${{ matrix.os }}
      WINDOWS_ICON: ${{ inputs.windows_icon }}
      MACOS_ICON: ${{ inputs.macos_icon }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, node24
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Initialize retained lane identity
        shell: python
        run: |
          import json, os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / ('modsync-package-' + os.environ['BUILD_TARGET'])
          out.mkdir(exist_ok=False)
          (out / 'lane.json').write_text(json.dumps({'schemaVersion': 1, 'sourceCommit': os.environ['SOURCE_SHA'], 'target': os.environ['BUILD_TARGET'], 'runnerOs': os.environ['RUNNER_OS'], 'runnerArchitecture': os.environ['RUNNER_ARCH'], 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'publication': False, 'nativeAcceptance': 'unverified', 'status': 'preparation-not-completed'}, indent=2) + '\n', encoding='utf-8')
      - name: Verify exact input and install selected toolchain
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rustup toolchain install 1.95.0 --profile minimal --target "$BUILD_TARGET"
      - name: Linux build dependencies
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev
      - name: Prepare locked dependency cache
        shell: bash
        # Fetch for every platform, not only BUILD_TARGET: the offline build also
        # compiles build scripts for the runner itself, and a 32-bit Windows build
        # on a 64-bit runner needs the x86_64 crates too.
        run: cargo +1.95.0 fetch --locked
      - name: Produce build receipt and assemble package
        shell: python
        run: |
          import glob, json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / ('modsync-package-' + os.environ['BUILD_TARGET'])
          out.mkdir(exist_ok=True)
          receipt = {'schemaVersion': 1, 'sourceCommit': os.environ['SOURCE_SHA'], 'target': os.environ['BUILD_TARGET'], 'runnerOs': os.environ['RUNNER_OS'], 'runnerArchitecture': os.environ['RUNNER_ARCH'], 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'publication': False, 'nativeAcceptance': 'unverified', 'status': 'preparing'}
          try:
              build = out / 'produced'
              command = [sys.executable, 'packaging/produce_build.py', '--commit', os.environ['SOURCE_SHA'], '--target', os.environ['BUILD_TARGET'], '--toolchain', '1.95.0', '--output-dir', str(build)]
              target_os = os.environ['TARGET_OS']
              icon = None
              icon_text = os.environ['WINDOWS_ICON'] if target_os == 'windows' else os.environ['MACOS_ICON'] if target_os == 'macos' else ''
              if icon_text:
                  icon = (root / icon_text).resolve()
                  if not icon.is_relative_to(root) or not icon.is_file() or (root / icon_text).is_symlink():
                      raise ValueError('Icon must be a tracked regular file inside checkout')
                  subprocess.run(['git', 'ls-files', '--error-unmatch', '--', icon.relative_to(root).as_posix()], check=True)
              if target_os == 'windows':
                  if icon is None:
                      raise ValueError('Windows lane blocked: reviewed ICO resource is missing')
                  tools = sorted(glob.glob(os.environ['ProgramFiles(x86)'] + '/Windows Kits/10/bin/*/x64/rc.exe'))
                  if not tools:
                      raise ValueError('Windows resource compiler is missing')
                  resource = out / 'resources.obj'
                  subprocess.run([sys.executable, 'packaging/windows_resources.py', '--compiler', tools[-1], '--kind', 'msvc', '--target', os.environ['BUILD_TARGET'], '--icon', str(icon), '--version', os.environ['PACKAGE_VERSION'] + '.0', '--output', str(resource)], check=True)
                  command += ['--windows-resource-object', str(resource), '--windows-resource-receipt', str(resource) + '.json']
              receipt['producingCommand'] = command
              subprocess.run(command, check=True)
              receipt['status'] = 'built'
              package = [sys.executable, 'packaging/build_package.py', '--target', os.environ['BUILD_TARGET'], '--commit', os.environ['SOURCE_SHA'], '--version', os.environ['PACKAGE_VERSION'], '--binary', str(build / ('modsync.exe' if target_os == 'windows' else 'modsync')), '--build-receipt', str(build / 'build-receipt.json'), '--output-dir', str(out / 'packages')]
              if target_os in ('windows', 'macos'):
                  if icon is None:
                      raise ValueError('Package blocked: reviewed native icon is missing')
                  package += ['--platform-icon', str(icon)]
              if target_os == 'windows':
                  package += ['--gui-launcher', str(build / 'modsync-gui.exe'), '--windows-resource-receipt', str(build / 'resources.obj.json')]
              receipt['packageCommand'] = package
              subprocess.run(package, check=True)
              receipt['status'] = 'packaged-unverified'
          except BaseException as error:
              receipt['errorType'] = type(error).__name__
              receipt['status'] += '-failed'
              raise
          finally:
              (out / 'lane.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
      # Every lane runs on its target's native architecture, so the packaged
      # binary itself can be started here. This catches a package that unpacks
      # to a binary that does not launch, which the receipts alone cannot see.
      - name: Smoke-test the packaged binary on its native runner
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, tarfile, tempfile, zipfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / ('modsync-package-' + os.environ['BUILD_TARGET'])
          packages = sorted(p for p in (out / 'packages').iterdir() if p.name.endswith(('.zip', '.tar.gz')))
          if len(packages) != 1:
              raise SystemExit(f'Expected one package, found {[p.name for p in packages]}')
          name = 'modsync.exe' if os.environ['TARGET_OS'] == 'windows' else 'modsync'
          expected = json.loads((out / 'produced' / 'build-receipt.json').read_text())['binaries']['modsync']
          lane = json.loads((out / 'lane.json').read_text())
          with tempfile.TemporaryDirectory() as temp:
              root = pathlib.Path(temp)
              if packages[0].name.endswith('.zip'):
                  with zipfile.ZipFile(packages[0]) as archive:
                      archive.extractall(root)
              else:
                  with tarfile.open(packages[0]) as archive:
                      archive.extractall(root, filter='data')
              found = [p for p in root.rglob(name) if p.is_file()]
              if len(found) != 1:
                  raise SystemExit(f'Expected one {name} in the package, found {len(found)}')
              binary = found[0]
              if hashlib.sha256(binary.read_bytes()).hexdigest() != expected:
                  raise SystemExit('Packaged binary differs from the build receipt')
              binary.chmod(0o755)
              result = subprocess.run([str(binary), '--version'], capture_output=True, text=True, timeout=120)
              print(result.stdout + result.stderr)
              if result.returncode != 0 or not result.stdout.startswith('modsync '):
                  raise SystemExit(f'Packaged binary failed to start (exit {result.returncode})')
          lane['smokeTest'] = {'command': '--version', 'output': result.stdout.strip(), 'binary': binary.relative_to(root).as_posix()}
          lane['status'] = 'packaged-smoke-tested'
          (out / 'lane.json').write_text(json.dumps(lane, indent=2, sort_keys=True) + '\n', encoding='utf-8')
      - name: Retain source-bound receipts and artifacts, including failed lanes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, node24
        with:
          name: modsync-${{ inputs.head_sha }}-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/modsync-package-${{ matrix.target }}/lane.json
            ${{ runner.temp }}/modsync-package-${{ matrix.target }}/produced/*.json
            ${{ runner.temp }}/modsync-package-${{ matrix.target }}/produced/modsync*
            ${{ runner.temp }}/modsync-package-${{ matrix.target }}/produced/resources.obj
            ${{ runner.temp }}/modsync-package-${{ matrix.target }}/packages/*
          retention-days: 14
          if-no-files-found: warn
