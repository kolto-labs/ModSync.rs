name: Production parity gates
# Every push and PR update runs the required Linux production checks, including
# Windows cross-compilation. Native Windows/macOS builds remain opt-in.
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      native:
    timeout-minutes: 60
        description: Also build natively on Windows and macOS (billed 2x/10x)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Rust tests remain frozen during the parity effort. These jobs deliberately
# compile only production lib/bin targets; passing is not full parity acceptance.
jobs:
  workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow syntax and expressions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: .github/workflows/ci.yml

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install system and MinGW packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev \
            libxcursor-dev libgl1-mesa-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --no-default-features --lib --bin modsync -j2
      - run: cargo clippy --locked --no-default-features --lib --bin modsync -j2 -- -D warnings
      - run: cargo build --locked --lib --bin modsync -j2
      - run: cargo clippy --locked --lib --bin modsync -j2 -- -D warnings
      - name: Windows cross-check headers
        # Vendored unrar includes <PowrProf.h> and <Wbemidl.h>; MinGW ships them in
        # lowercase, which only matters on a case-sensitive filesystem.
        run: |
          dir="$RUNNER_TEMP/wininc"
          mkdir -p "$dir"
          for header in PowrProf Wbemidl; do
            echo "#include <$(echo "$header" | tr '[:upper:]' '[:lower:]').h>" > "$dir/$header.h"
          done
          echo "CXXFLAGS_x86_64_pc_windows_gnu=-I$dir" >> "$GITHUB_ENV"
      - run: cargo clippy --locked --no-default-features --lib --bin modsync --target x86_64-pc-windows-gnu -j2 -- -D warnings
      - run: cargo clippy --locked --lib --bin modsync --target x86_64-pc-windows-gnu -j2 -- -D warnings

  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked --no-default-features --lib --bin modsync -j2
      - run: cargo clippy --locked --no-default-features --lib --bin modsync -j2 -- -D warnings
      - run: cargo build --locked --lib --bin modsync -j2
      - run: cargo clippy --locked --lib --bin modsync -j2 -- -D warnings

  # Rust test suite. Off while upstream's parity freeze is in effect (AGENTS.md:
  # tests are not compiled or run until full parity). Set the repository
  # variable RUN_RUST_TESTS to `true` to turn it on for every commit; no
  # workflow edit is needed. Until then the job is skipped, not failed.
  tests:
    if: vars.RUN_RUST_TESTS == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev             libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev             libxcursor-dev libgl1-mesa-dev
      - name: Tests (CLI-only build)
        run: cargo test --locked --no-default-features -j2
      - name: Tests (default build with desktop)
        run: cargo test --locked -j2

  result:
    name: Required CI result
    needs: [workflows, production, native, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory or requested job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRE_NATIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.native }}
          REQUIRE_TESTS: ${{ vars.RUN_RUST_TESTS == 'true' }}
        run: |
          python3 - <<'PYRESULT'
          import json
          import os
          import sys

          results = json.loads(os.environ['NEEDS_JSON'])
          required = ['workflows', 'production']
          for job, flag in [('native', 'REQUIRE_NATIVE'), ('tests', 'REQUIRE_TESTS')]:
              if os.environ[flag] == 'true':
                  required.append(job)
          failed = [job for job in required if results.get(job, {}).get('result') != 'success']
          for job in required:
              print(f"{job} = {results.get(job, {}).get('result', 'missing')}")
          if failed:
              print('::error::Required CI jobs missing, skipped, cancelled or failed: ' + ', '.join(failed))
              sys.exit(1)
          PYRESULT
