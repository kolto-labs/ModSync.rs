name: Prove Community Patches and predecessor guards in four native runtime lanes
on:
  workflow_dispatch:
    inputs:
      feature_sha:
        description: Exact reviewed feature commit; must equal dispatched workflow SHA
        required: true
        type: string
permissions: {contents: read, actions: read}
concurrency:
  group: community-patch-native-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    if: github.repository == 'kolto-labs/ModSync.rs' && github.ref == 'refs/heads/fix/fullrun-ci-credentials'
    strategy:
      fail-fast: false
      matrix: {game: [k1, k2], mode: [cli, gui]}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GAME: ${{ matrix.game }}
      MODE: ${{ matrix.mode }}
      FEATURE_SHA: ${{ inputs.feature_sha || github.sha }}
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Admit immutable workflow and feature pin
        env:
          DIAGNOSTICS_RECIPIENT: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
        run: |
          [[ "$FEATURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$FEATURE_SHA" = "$GITHUB_SHA"
          test -n "$DIAGNOSTICS_RECIPIENT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.feature_sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kolto-labs/mod-builds
          ref: 67dc5fd8da6abde324c51d32eee3d04687070dd6
          path: guide-input
          persist-credentials: false
      - name: Prepare disposable production and desktop runtime
        timeout-minutes: 15
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/community-patch-evidence"
          packages=(age xvfb xauth xdotool pkg-config libssl-dev zstd openssl python3-tk tesseract-ocr libxkbcommon-x11-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev scrot)
          if [[ "$GAME" == k2 ]]; then
            sudo dpkg --add-architecture i386
            packages+=(wine wine64 wine32:i386)
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends "${packages[@]}"
          python -m pip install PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
          rustup toolchain install 1.95.0 --profile minimal
      - name: Recover genuine owned baseline and only exact original retained inputs
        timeout-minutes: 35
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_TOKEN: ${{ github.token }}
          ARTSTORE_REPOSITORY: ${{ github.repository }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import artstore,artstore_client,fullrun_baseline
          root=Path(os.environ['RUNNER_TEMP']); evidence=root/'community-patch-evidence'; game=os.environ['GAME']
          assert os.environ['ARTSTORE_REPOSITORY']==os.environ['GITHUB_REPOSITORY']=='kolto-labs/ModSync.rs'
          pins={'k1':[{'guid':'6fb1971d-5775-85e5-9e77-ecc68a896e84','filename':'K1_Community_Patch_v1.10.0.zip','sha256':'cdee80d28f9f87ffaa0b39fdfb46a2a3139858d87b3695d5161c96c02df14068','bytes':86802053},
                      {'guid':'6fb1971d-5775-85e5-9e77-ecc68a896e84','filename':'K1CP Patch.rar','sha256':'8564c745f3cd545cc356fc9932b5ede331adbd0b7bdd365da3bcd6f4b613665c','bytes':128612},
                      {'guid':'f966fc1f-6b47-88fc-9050-07b1371eb56a','filename':'NPC clothing M.rar','sha256':'26a994916d13fe6087a405d712e4926ef5acf0c11e1ea6fd978623eac397bcac','bytes':90018051}],
                'k2':[{'guid':'bee5a72b-d748-8f83-8261-81758a9bfc56','filename':'tslrcm2022.exe','sha256':'94c99c4807da4b304de6e0efed1be55e0f43d13cc5a274582ed3323ac0e2f1a6','bytes':137947655},
                      {'guid':'216eb8b6-3076-8a92-bd7d-012862b10b32','filename':'K2CP_v1.6.3.zip','sha256':'6e734ed7e81ad8169d12870ce9fcf829bd56b88f22e7ea20fb37fcb85b8580c1','bytes':80523387}]}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(4*1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          report={'status':'acquiring','repository':os.environ['GITHUB_REPOSITORY'],'game':game,'materials':[]}
          try:
              result=fullrun_baseline.recover(game,root/'sealed',root/'game',audit_backup=False)
              assert result['available'] and result['origin'].startswith('artifact:current:kolto-labs/ModSync.rs:')
              client=artstore_client.from_environment(); index=artstore.load_index(client)
              identifier=int(result['origin'].rsplit(':',1)[1])
              matches=[item for item in client.list_artifacts() if int(item['id'])==identifier]
              assert len(matches)==1 and not matches[0].get('expired',False)
              result.update(baseline_artifact=matches[0],sealed_sha256=digest(root/'sealed'/'baseline.seal'))
              report['baseline']=result
              archives=root/'archives'; archives.mkdir(mode=0o700)
              packs={}
              for pin in pins[game]:
                  report['stage']='fetch-'+pin['guid']; record=index['blobs'][pin['sha256']]
                  assert record['size']==pin['bytes']
                  destination=archives/pin['filename']
                  assert artstore.fetch(pin['sha256'],destination,client=client,index=index,workdir=root/'parts')
                  assert destination.is_file() and not destination.is_symlink()
                  assert destination.stat().st_size==pin['bytes'] and digest(destination)==pin['sha256']
                  report['materials'].append({**pin,'blob':record})
                  packs.update({part['pack']:index['packs'][part['pack']] for part in record['parts']})
              report.update(status='acquired',packs=packs)
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__); raise
          finally:
              (evidence/'material-provenance.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Acquire authenticated encrypted exact-head production binary
        id: production-build
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          umask 077
          status=0
          python tools/modsync-ci/production_build.py fetch --mode "$MODE" \
            --destination target/release/modsync --wait-seconds 3300 \
            --receipt "$RUNNER_TEMP/community-patch-evidence/production-build-provenance.json" \
            >"$RUNNER_TEMP/community-patch-evidence/production-build.log" 2>&1 || status=$?
          if [[ "$status" == 0 ]]; then
            echo 'reused=true' >>"$GITHUB_OUTPUT"
          elif [[ "$status" == 3 ]]; then
            echo 'reused=false' >>"$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - name: Build actual production library and binary without acquisition credentials
        if: ${{ steps.production-build.outputs.reused == 'false' }}
        timeout-minutes: 40
        run: |
          flags=()
          if [[ "$MODE" == cli ]]; then flags+=(--no-default-features); fi
          env -i PATH="$PATH" HOME="$HOME" RUSTUP_TOOLCHAIN=1.95.0 \
            CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true \
            cargo build --locked --release --lib --bin modsync -j2 "${flags[@]}" \
            >"$RUNNER_TEMP/community-patch-evidence/build.log" 2>&1
          printf '%s\n' '{"schema_version":1,"source":"local-build-fallback","reason":"exact-head producer unavailable"}' \
            >"$RUNNER_TEMP/community-patch-evidence/production-build-selection.json"
      - name: Bind and independently review exact source owners then run actual application
        timeout-minutes: 65
        run: |
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GAME="$GAME" MODE="$MODE" FEATURE_SHA="$FEATURE_SHA" \
            python - <<'PY'
          import contextlib,copy,hashlib,json,os,re,shutil,struct,subprocess,sys,time
          from pathlib import Path
          from types import SimpleNamespace
          sys.path.insert(0,'tools/modsync-ci')
          import gui_rust
          root=Path(os.environ['RUNNER_TEMP']); evidence=root/'community-patch-evidence'; private=root/'community-patch-private'; private.mkdir(mode=0o700)
          game=root/'game'; archives=root/'archives'; game_id=os.environ['GAME']; binary=Path('target/release/modsync').resolve()
          spec={'k1':{'guid':'6fb1971d-5775-85e5-9e77-ecc68a896e84','index':5,'count':197,'step':'step-006',
                  'guide_sha':'44067788c6cb7a83b38d468817f273ce5cc901cd5e000c0f9ff65f8af15fc6ed','plan_sha':'1b402ba085625c4863795069eaacaef0f53e8ea7179e56a5bd150d88eb9c0a74',
                  'book':'reviewed_manual_community_patch_k1.json','book_sha':'923c0a5ebe52615247717bd3bab6ce48bad98cc664825a840465025b2b7e1fbc','kind':'ReviewedManualK1NativePatcher'},
                'k2':{'guid':'216eb8b6-3076-8a92-bd7d-012862b10b32','index':8,'count':151,'step':'step-009',
                  'guide_sha':'f442bdf574031623ed577609730d887069b9bc8e38e8e2f38ecc43a7e7487d5f','plan_sha':'0add8c1aeb7cdfad3df4b21761e135c150aa7832cf3fc0edabe01a91245a9258',
                  'book':'reviewed_manual_community_patch_k2.json','book_sha':'c8f3877165f3da1adc8d5d76cc86ef8e803cc5d2a012aa22ef1f1fb25723db74','kind':'ReviewedManualK2NativePatcher'}}[game_id]
          vendor='bee5a72b-d748-8f83-8261-81758a9bfc56'; npc='f966fc1f-6b47-88fc-9050-07b1371eb56a'
          guids=[spec['guid'],npc] if game_id=='k1' else [vendor,spec['guid']]
          indices=[5,46] if game_id=='k1' else [1,8]
          cp_index=0 if game_id=='k1' else 1
          master_sha='766236adcae5c0b720bacd8701274286d19d2a3753dbecbd4b2daa6faedf0ac9'
          report={'status':'running','game':game_id,'mode':os.environ['MODE'],'engine_sha':os.environ['FEATURE_SHA'],'stages':[],
              'scope':'reduced native Community Patch proof: K1 original CP then NPC with committed predecessor guard; K2 original English TSLRCM then CP; no original-tool witness, full-guide, merge or cross-lane byte equivalence claim'}
          def save(): (evidence/'native-proof.json').write_text(json.dumps(report,indent=2))
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(4*1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          def value_sha(value):return hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          def run(label,command,timeout=1800,structured=False):
              start=time.monotonic()
              with contextlib.ExitStack() as stack:
                  log=stack.enter_context((evidence/(label+'.log')).open('wb'))
                  stderr=stack.enter_context((evidence/(label+'-stderr.log')).open('wb')) if structured else subprocess.STDOUT
                  result=subprocess.run(list(map(str,command)),stdin=subprocess.DEVNULL,stdout=log,stderr=stderr,timeout=timeout)
              report['stages'].append({'name':label,'exit_code':result.returncode,'seconds':time.monotonic()-start});save()
              assert result.returncode==0,label
          def document(path):
              value=json.loads(path.read_text());assert isinstance(value,dict) and value['ModSyncSourceOrder']==guids
              assert [component['Guid'] for component in value['thisMod']]==guids
              return value
          def manifest(directory):
              observed={}
              for path in sorted(directory.rglob('*')):
                  assert not path.is_symlink()
                  if path.is_file():observed[str(path.relative_to(directory))]=digest(path)
              assert observed;return observed
          state=game.parent/('.modsync-'+hashlib.sha256(os.fsencode(str(game))).hexdigest()[:16])
          try:
              guide=Path('guide-input/content')/game_id/'full.md'; assert digest(guide)==spec['guide_sha']
              plan_path=Path('tools/modsync-ci/fixtures/ci')/(game_id+'-manual-plan.json'); assert digest(plan_path)==spec['plan_sha']
              source_plan=json.loads(plan_path.read_text()); original_step=source_plan['steps'][spec['index']]
              assert original_step['id']==spec['step']
              book_path=Path('src/archive_generation')/spec['book']; assert digest(book_path)==spec['book_sha']
              book=json.loads(book_path.read_text());assert book['schema']==1 and len(book['recipes'])==1
              assert book['source_guide_sha256']==spec['guide_sha'] and book['source_plan_sha256']==spec['plan_sha']
              cp_recipe=book['recipes'][0];assert cp_recipe['component_guid']==spec['guid']
              assert cp_recipe['source_component_index']==cp_recipe['plan_step_index']==spec['index'] and cp_recipe['plan_step']==original_step
              for pin in cp_recipe['archives']:assert source_plan['archive_sha256']['{archives}/'+pin['filename']]==pin['sha256']
              recipes={spec['guid']:cp_recipe};identities={spec['guid']:(spec['book'],spec['book_sha'])}
              if game_id=='k1':
                  npc_book_path=Path('src/archive_generation/reviewed_manual_k1.json');assert digest(npc_book_path)=='b04b7331b5001f81698feb5571460ea9e2e486d032956abb22967d704254c338'
                  npc_recipe=next(item for item in json.loads(npc_book_path.read_text())['recipes'] if item['component_guid']==npc)
                  assert npc_recipe['source_component_index']==npc_recipe['plan_step_index']==46 and npc_recipe['plan_step']['id']=='step-047'
                  recipes[npc]=npc_recipe
                  identities[npc]=('reviewed_manual_k1.json',digest(npc_book_path))
                  assert digest(Path('src/archive_generation/reviewed_master_k1.json'))==master_sha
              report.update(binary_sha256=digest(binary),source_guide_sha256=digest(guide),source_plan_sha256=digest(plan_path),community_book=spec['book'],community_book_sha256=spec['book_sha'])
              shutil.copyfile(guide,evidence/'original-source-guide.md')
              run('normalize-baseline',[sys.executable,'tools/modsync-ci/game_cache.py','normalize-case','--game',game_id,'--game-dir',game,'--label','focused-community-patch'])
              with (game/'dialog.tlk').open('rb') as stream:header=stream.read(12)
              assert header[:8]==b'TLK V3.0' and struct.unpack('<I',header[8:])[0]==0
              report['baseline_english_tlk_sha256']=digest(game/'dialog.tlk')
              before=manifest(game); source_before=manifest(archives)
              (evidence/'whole-game-before-manifest.json').write_text(json.dumps(before,indent=2))
              whole=private/'whole.json'; projected=private/'projected.json'; canonical_path=private/'canonical.json'; bound=private/'bound.json'; reviewed=private/'reviewed.json'; model=private/'reviewed.toml'
              run('original-convert',[binary,'convert',guide,whole,'--format','json','--parse-directions'])
              original=json.loads(whole.read_text()); assert isinstance(original,list) and len(original)==spec['count']
              inventory=[component['Guid'] for component in original]; assert len(set(inventory))==spec['count'] and inventory[spec['index']]==spec['guid']
              if game_id=='k2':assert inventory[1]==vendor
              selected=[copy.deepcopy(original[index]) for index in indices]; assert [c['Guid'] for c in selected]==guids
              projected.write_text(json.dumps({'ModSyncSourceOrder':guids,'thisMod':selected},indent=2))
              report.update(original_source_inventory=inventory,original_component_indices=indices,selected_guids=guids,full_source_component_count=len(original))
              run('canonical-export',[binary,'convert',projected,canonical_path,'--format','json'])
              admitted=document(canonical_path)['thisMod']
              if game_id=='k2':
                  source=Path('src/vendor_installer.rs').read_text(); vendor_raw=json.loads(source.split('const REVIEWED_INPUT: &str = r###"',1)[1].split('"###;',1)[0])
                  assert selected[0]==vendor_raw
                  assert {k:v for k,v in admitted[0].items() if k!='Language'}=={k:v for k,v in selected[0].items() if k!='Language'}
              for original_owner,loaded in zip(selected,admitted):
                  guid=original_owner['Guid']
                  if guid in recipes:
                      assert original_owner==recipes[guid]['raw_input_component']
                      assert loaded==recipes[guid]['canonical_input_component']
              groups=[]
              if game_id=='k2':groups.append({'componentGuid':vendor,'filenames':['tslrcm2022.exe'],'sha256':'94c99c4807da4b304de6e0efed1be55e0f43d13cc5a274582ed3323ac0e2f1a6','sizeBytes':137947655,'vendorLanguage':'english'})
              for guid in guids:
                  if guid not in recipes:continue
                  pins=recipes[guid]['archives']
                  assert pins and len(pins)==(2 if guid==spec['guid'] and game_id=='k1' else 1)
                  for pin in pins:assert digest(archives/pin['filename'])==pin['sha256']
                  group={'componentGuid':guid,'filenames':[pin['filename'] for pin in pins]}
                  if len(pins)==1:group.update(sha256=pins[0]['sha256'],sizeBytes=(archives/pins[0]['filename']).stat().st_size)
                  groups.append(group)
              resolved=private/'resolved.json';resolved.write_text(json.dumps(groups,indent=2))
              run('community-patch-bind',[binary,'convert',projected,bound,'--format','json','--source-path',archives,'--resolved-archives',resolved])
              generated=document(bound)['thisMod'];native=generated[cp_index];binding=native['AuthoredRecipeBinding']
              assert all(c['DraftReview']['RequiresReview'] is True for c in generated)
              assert native['DraftReview']['Generator']=='reviewed-manual-native-patcher'
              assert binding['Kind']==spec['kind'] and binding['DatabookSha256']==spec['book_sha']
              assert binding['InputComponent']==admitted[cp_index] and binding['Recipe']==cp_recipe
              assert binding['SourceGuideSha256']==spec['guide_sha'] and binding['SourcePlanSha256']==spec['plan_sha']
              actual={entry['Filename']:entry for entry in binding['Archives']}
              assert set(actual)=={pin['filename'] for pin in cp_recipe['archives']}
              for pin in cp_recipe['archives']:
                  assert actual[pin['filename']]['Sha256']==pin['sha256']
                  assert actual[pin['filename']]['Bytes']==(archives/pin['filename']).stat().st_size
              cp_steps=native['Instructions'];patcher_index=2 if game_id=='k1' else 1
              assert [step['Action'] for step in cp_steps]==(['ExtractTo','ExtractTo','Patcher','CopyFile','CopyFile'] if game_id=='k1' else ['ExtractTo','Patcher'])
              assert cp_steps[patcher_index]['Arguments']=='changes.ini' and cp_steps[patcher_index]['Destination']=='<<kotorDirectory>>'
              assert {k:v for k,v in native.items() if k not in ('Instructions','DraftReview','AuthoredRecipeBinding')}=={k:v for k,v in admitted[cp_index].items() if k not in ('Instructions','DraftReview')}
              if game_id=='k1':
                  assert [Path(step['Source'][0]).name for step in cp_steps[3:]]==['n_fatcomm.mdl','n_fatcomm.mdx']
                  assert [step['Destination'].replace('\\','/').casefold().removeprefix('<<kotordirectory>>/') for step in cp_steps[3:]]==['override/n_fatcomm.mdl','override/n_fatcomm.mdx']
                  assert all(step['Overwrite'] is True for step in cp_steps[3:])
                  npc_owner=generated[1];master=npc_owner['ReviewedMasterBinding']
                  assert npc_owner['DraftReview']['Generator']=='reviewed-source-master-v1'
                  assert npc_owner['Dependencies']==[spec['guid']] and npc_owner['UnresolvedMasters']==[]
                  assert master['AuthoritySha256']==master_sha and master['RequiredPredecessors']==[spec['guid']]
                  assert master['OriginalUnresolvedMasters']==['K1 Community Patch'] and master['OriginalDependencies']==[]
                  assert master['InstallationRequirement']=='owned-committed-predecessor-checkpoint-before-effects-v1'
                  assert npc_owner['AuthoredRecipeBinding']['Recipe']==npc_recipe
                  assert npc_owner['AuthoredRecipeBinding']['InputComponent']==admitted[1]
                  assert [step['Action'] for step in npc_owner['Instructions']]==['ExtractTo']+['CopyFile']*14
                  assert len(npc_owner['Instructions'])==15
                  assert {k:v for k,v in npc_owner.items() if k not in ('Instructions','DraftReview','AuthoredRecipeBinding','ReviewedMasterBinding','Dependencies','UnresolvedMasters')}=={k:v for k,v in admitted[1].items() if k not in ('Instructions','DraftReview','Dependencies','UnresolvedMasters')}
              else:assert generated[0]['VendorInstallerBinding']['InputComponent']==admitted[0]
              run('independent-replay',[binary,'convert',bound,reviewed,'--format','json','--source-path',archives,'--review-verified-drafts'])
              final=document(reviewed)['thisMod']
              for pending,cleared in zip(generated,final):
                  assert cleared['DraftReview']['RequiresReview'] is False
                  verification=cleared['DraftReview']['Verification']; assert verification['Reviewer']=='modsync-ci-tool' and verification['IdentityVersion']==2
                  assert {k:v for k,v in cleared.items() if k!='DraftReview'}=={k:v for k,v in pending.items() if k!='DraftReview'}
              cp_verification=final[cp_index]['DraftReview']['Verification']
              assert cp_verification['ArchiveFilename']==spec['book'] and cp_verification['ArchiveSha256']==spec['book_sha']
              assert cp_verification['ReplayDigest']==value_sha(generated[cp_index])
              if game_id=='k1':
                  verification=final[1]['DraftReview']['Verification'];assert verification['ArchiveFilename']=='reviewed-source-master-k1-v1' and verification['ArchiveSha256']==master_sha
                  pending=copy.deepcopy(generated[1]);pending.pop('IsSelected');assert verification['ReplayDigest']==value_sha(pending)
              run('saved-model-export',[binary,'convert',reviewed,model,'--format','toml'])
              run('saved-model-roundtrip',[binary,'convert',model,private/'roundtrip.json','--format','json'])
              assert document(private/'roundtrip.json')['thisMod']==final
              for guid in guids:
                  run('review-'+guid,[binary,'guide-draft-review',model,guid],structured=True)
                  assert json.loads((evidence/('review-'+guid+'.log')).read_text())['requiresReview'] is False
              run('phase-plan',[binary,'phase-plan',model],structured=True)
              phase=json.loads((evidence/'phase-plan.log').read_text());assert phase['execution_order']==phase['base']==guids and phase['remaining']==[] and phase['installed'] is False
              runner=[]
              if game_id=='k2':
                  requests=root/'execute-requests';requests.mkdir(mode=0o700);prefix=requests/'wine-prefix';prefix.mkdir(mode=0o700)
                  runner=['--execute-request-dir',str(requests),'--execute-wine-prefix',str(prefix)]
                  for flag,program in [('execute-xvfb','Xvfb'),('execute-wine','wine'),('execute-wineserver','wineserver')]:runner+=['--'+flag,str(Path(shutil.which(program)).resolve(strict=True))]
              arguments=['--input',model,'--game-dir',game,'--source-dir',archives,'--use-file-selection','--non-interactive',*(['--allow-processes'] if game_id=='k2' else []),*runner]
              run('validate',[binary,'validate',*arguments])
              assert manifest(game)==before and manifest(archives)==source_before, 'validation changed input roots'
              if os.environ['MODE']=='cli':
                  run('native-install',[binary,'install',*arguments,'--component-checkpoints'],3000)
                  outcome_logs=[evidence/'native-install.log'];prediction_logs=[evidence/'validate.log',*outcome_logs]
              else:
                  run('actual-desktop',[sys.executable,'tools/modsync-ci/gui_rust.py','--binary',binary,'--input',model,'--game-dir',game,'--archives',archives,
                      '--work-dir',root/'gui-work','--report',evidence/'gui-report.json','--timeout','3000','--complete-guide',*runner],3100)
                  desktop=json.loads((evidence/'gui-report.json').read_text());assert desktop['status']=='installed' and desktop['ui_completed'] is True
                  phases=desktop['phases'];assert len(phases)==1 and phases[0]['phase']=='base' and phases[0]['expected_guids']==sorted(guids)
                  assert phases[0]['completed_guids']==sorted(guids) and phases[0]['ui_completed'] and phases[0]['validation_passed'] and phases[0]['snapshot_confirmed']
                  settings=list((root/'gui-work').glob('gui-rust-*/settings'));assert len(settings)==1
                  outcome_logs=sorted((settings[0]/'Logs').glob('kotormodsync_*.log'));assert 0<len(outcome_logs)<=8
                  prediction_logs=[evidence/'validate.log',*outcome_logs];report['desktop_phases']=phases
              verified={};gui_rust.verify_receipt(SimpleNamespace(game_dir=game,archives=archives),verified,lambda:None,guids)
              completion_path=state/'completion.json';completion=json.loads(completion_path.read_text())
              assert [c['Guid'].lower() for c in completion['components']]==guids
              assert completion['components'][cp_index]['AuthoredRecipeBinding']==binding
              checkpoint=completion['installReport']['checkpoint'];assert checkpoint['sessionId'] and checkpoint['checkpointId'] and checkpoint['generation']>0
              assert not (state/'external-writers-v1.json').exists() and not list((state/'checkpoints-v1'/'operations').glob('*.json'))
              shutil.copyfile(completion_path,evidence/'completion.json')
              after=manifest(game);assert after!=before
              if game_id=='k1':
                  actual_paths={path.casefold():path for path in after};assert len(actual_paths)==len(after)
                  patch_outputs=[('n_fatcomm.mdl',165908,'f757d1c31f835103c6ddec12aa19b45b43ca3602b32bc2b8fa04362fba9fe809'),
                      ('n_fatcomm.mdx',139344,'ef6bfc4faac38925057bba71e83842dc07cf7378bd19d56f21c055c38820da77')]
                  for filename,size,sha in patch_outputs:
                      path=game/actual_paths['override/'+filename]
                      assert path.stat().st_size==size and digest(path)==sha
              (evidence/'whole-game-after-manifest.json').write_text(json.dumps(after,indent=2))
              def outcomes(paths,marker):
                  found={}
                  for path in paths:
                      assert path.is_file() and not path.is_symlink() and path.stat().st_size<=64*1024*1024
                      for line in path.read_text(errors='strict').splitlines():
                          if marker in line:
                              payload=line.split(marker,1)[1];value,end=json.JSONDecoder().raw_decode(payload);found[payload[:end]]=value
                  return list(found.values())
              installed=outcomes(outcome_logs,'Reviewed native Patcher outcome: ')
              predicted=outcomes(prediction_logs,'Strict native prediction outcome: ')
              assert len(installed)==1 and installed[0]['ComponentGuid']==spec['guid'] and predicted
              for outcome in [*installed,*predicted]:
                  assert outcome['Contract']=='native-zero-warnings-changed-game-v1'
                  assert outcome['Failed']==outcome['Warnings']==outcome['Errors']==0
                  assert outcome['Added']+outcome['Removed']+outcome['Changed']>0
                  assert outcome['BeforeManifestSha256']!=outcome['AfterManifestSha256']
                  assert 0<outcome['LogBytes']<=8*1024*1024 and re.fullmatch('[0-9a-f]{64}',outcome['LogSha256'])
              report.update(status='installed',completion=verified,checkpoint=checkpoint,community_patch_binding=binding,
                  reviews={c['Guid']:c['DraftReview'] for c in final},installed_native_outcome=installed[0],strict_private_prediction_outcomes=predicted)
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__);raise
          finally:
              # Metadata/log allowlist only. Never collect archives, game bytes,
              # EXE/INI, screenshots, prefixes, CAS, checkpoints or snapshots.
              paths=[state/'external-writers-v1.json',state/'checkpoints-v1'/'active.json']
              paths+=sorted((state/'checkpoints-v1'/'operations').glob('*.json'))[:16]
              for index,path in enumerate(paths):
                  if path.is_symlink() or not path.is_file() or path.stat().st_size>4*1024*1024:continue
                  if path.resolve().is_relative_to(state.resolve()):shutil.copyfile(path,evidence/('checkpoint-'+str(index)+'-'+path.name))
              gui_root=root/'gui-work';total=0
              if gui_root.is_dir():
                  for index,path in enumerate(sorted(gui_root.rglob('*'))):
                      if path.is_symlink() or not path.is_file() or path.suffix not in ('.json','.log'):continue
                      if not path.resolve().is_relative_to(gui_root.resolve()):continue
                      size=path.stat().st_size
                      if size>16*1024*1024 or total+size>64*1024*1024:continue
                      shutil.copyfile(path,evidence/('desktop-'+str(index)+'-'+path.name));total+=size
              save()
          PY
      - name: Bound metadata and diagnostic logs even on failure
        if: success() || failure()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'community-patch-evidence';root.mkdir(mode=0o700,exist_ok=True)
          records=[];total=0
          for path in sorted(root.iterdir()):
              assert not path.is_symlink() and path.is_file() and path.suffix in ('.json','.log','.md')
              size=path.stat().st_size
              if path.suffix=='.log' and size>8*1024*1024:
                  with path.open('rb') as stream:stream.seek(-8*1024*1024,2);body=stream.read()
                  path.write_bytes(b'[bounded log tail]\n'+body)
              elif size>16*1024*1024:path.write_text(json.dumps({'retention':'oversized metadata omitted','original_bytes':size}))
              total+=path.stat().st_size;assert total<=192*1024*1024
              records.append({'name':path.name,'bytes':path.stat().st_size})
          (root/'retention-allowlist.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Retain independently encrypted metadata and failure diagnostics
        if: success() || failure()
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/community-patch-evidence
          name: community-patch-native-${{ matrix.game }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-recipient: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
