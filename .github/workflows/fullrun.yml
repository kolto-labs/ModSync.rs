# Step status guard: success() || failure() overrides implicit success() gating,
# allowing eligible steps after success or failure; it is false when cancelled.
# Existing input/platform/prerequisite predicates still apply. This guard does not
# change workflow concurrency or aggregate failures; failure reporting is separate.
# https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-cancellation
name: CI

# Orchestrate reusable cache workflows and every install lane.
# Caches only make runs faster. A missing cache is refilled; the run fails only
# when a job cannot actually get the game, cannot get a required mod archive from
# any source (cache, P2P, the optional R2 bucket, the website) or finish its install.
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', 'meta.json', 'README.md']
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:
    inputs:
      game_seed_probe:
        description: Restore and cache both game seeds only (no Steam login or install lanes)
        type: boolean
        default: false
      use_steam_guard_codes:
        description: Allow single-use Steam Guard codes on this manual run
        type: boolean
        default: false
      seed_archives:
        description: Seed the archive cache from the staging remote (main only; skips every other job)
        type: boolean
        default: false
      seed_dry_run:
        description: Seed only - verify every staged file against its pin but write nothing to the cache
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Only push to main, schedule and manual dispatch write the large Actions caches. Pull requests and
  # releases only restore, so a 3 GB game or archive entry is not duplicated per ref and the 10 GB cap holds.
  CACHE_WRITER: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

# Push, schedule, release and dispatch runs share one group per ref, so two full CI runs on the same ref
# never overlap (a newer queued run replaces an older queued one; a running one is never cancelled).
# Main's cache-writing runs therefore never overlap, and a feature-branch push cannot replace a queued
# main run. Pull requests queue per PR and a newer commit cancels the older run of the same PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-full-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The guards the lanes rely on (coverage, quarantine, receipts, cache verification) are only as good as
  # their unit tests, so run them on every event. Needs no secrets.
  tools:
    name: tools unit tests
    if: ${{ !inputs.seed_archives || inputs.game_seed_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false
      - name: Validate dispatch mode
        if: ${{ success() || failure() }}
        env:
          SEED_ARCHIVES: ${{ inputs.seed_archives }}
          GAME_SEED_PROBE: ${{ inputs.game_seed_probe }}
        run: |
          if [[ "$SEED_ARCHIVES" == true && "$GAME_SEED_PROBE" == true ]]; then
            echo "::error::seed_archives and game_seed_probe are mutually exclusive."
            exit 1
          fi
      - name: Run the tools/modsync-ci unit tests
        if: ${{ success() || failure() }}
        run: python3 -m unittest discover -s tools/modsync-ci -p 'test_*.py'

  # Fork and dependabot pull requests get no secrets, so they skip every job (install jobs need game).
  game:
    name: game cache
    if: ${{ !inputs.seed_archives && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cache-game.yml
    with:
      cache_writer: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      game_seed_probe: ${{ inputs.game_seed_probe || false }}
      use_steam_guard_codes: ${{ inputs.use_steam_guard_codes || false }}
    secrets: inherit

  mods:
    if: ${{ !inputs.seed_archives && !inputs.game_seed_probe && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/cache-archives.yml
    with:
      mode: refresh
      cache_writer: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  artstore-refresh:
    name: artstore refresh
    needs: [mods]
    if: ${{ !cancelled() && !inputs.seed_archives && !inputs.game_seed_probe && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/cache-archives.yml
    with:
      mode: renew
      cache_writer: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  seed:
    name: seed archive cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_archives && !inputs.game_seed_probe }}
    permissions:
      contents: read
    uses: ./.github/workflows/cache-seed.yml
    with:
      seed_dry_run: ${{ inputs.seed_dry_run || false }}
    secrets: inherit

  p2p-loopback:
    if: ${{ !inputs.seed_archives && !inputs.game_seed_probe && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false

      - name: Resolve ModSync source repository
        if: ${{ success() || failure() }}
        id: source
        env:
          RUST_REPOSITORY: ${{ vars.MODSYNC_RS_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ -z "$RUST_REPOSITORY" ]]; then
            echo "::error::The repository variable for the rust ModSync source is empty."
            exit 1
          fi
          echo "repository=$RUST_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Check out ModSync (rust)
        if: ${{ success() || failure() }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN || github.token }}
          path: .modsync-source
          persist-credentials: false

      - name: Let cargo fetch private git dependencies
        if: ${{ success() || failure() }}
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_TOKEN" ]]; then
            echo "::add-mask::$SOURCE_TOKEN"
            git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install build tools
        if: ${{ success() || failure() }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev >/dev/null

      - name: Build modsync
        if: ${{ success() || failure() }}
        working-directory: .modsync-source
        run: cargo build --locked --bin modsync

      - name: Transfer a random archive between two peers on loopback
        if: ${{ success() || failure() }}
        run: python3 tools/modsync-ci/p2p_loopback.py --binary .modsync-source/target/debug/modsync

  install:
    name: install (${{ matrix.game }}, ${{ matrix.mode }})
    needs: [game, mods]
    # Run per game even if the other game failed; unpacking fails if this game is missing.
    if: ${{ !cancelled() && !inputs.game_seed_probe && needs.game.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # A job-level block replaces the top-level one, so contents: read is repeated. actions: read lets the
    # artifact-store tier list and download artifacts.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        game: [k1, k2]
        mode: [cli, gui]
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false

      - name: Resolve ModSync source repository
        if: ${{ success() || failure() }}
        id: source
        env:
          RUST_REPOSITORY: ${{ vars.MODSYNC_RS_REPOSITORY }}
        run: |
          set -euo pipefail
          repository="$RUST_REPOSITORY"
          if [[ -z "$repository" ]]; then
            echo "::error::The MODSYNC_RS_REPOSITORY variable for the ModSync source is empty."
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Check out ModSync
        if: ${{ success() || failure() }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN || github.token }}
          path: .modsync-source
          persist-credentials: false

      - name: Let cargo fetch private git dependencies
        if: ${{ success() || failure() }}
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_TOKEN" ]]; then
            echo "::add-mask::$SOURCE_TOKEN"
            git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install tools and free disk space
        if: ${{ success() || failure() }}
        run: |
          # Remove the large preinstalled toolchains no lane uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm /opt/microsoft /opt/az
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
          packages=(p7zip-full pkg-config libssl-dev)
          if [[ '${{ matrix.mode }}' == gui ]]; then
            packages+=(xvfb xauth python3-tk tesseract-ocr tesseract-ocr-eng libxkbcommon-x11-dev
              libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev)
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}" >/dev/null

      - name: Install GUI driver
        if: ${{ (success() || failure()) && (matrix.mode == 'gui') }}
        run: |
          python -m pip install --quiet PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
          python -c 'import sys, tkinter; print("GUI driver interpreter:", sys.executable, "tk", tkinter.TkVersion)' \
            || { echo "::error::tkinter is not importable by the interpreter that runs gui_rust.py (PyAutoGUI/MouseInfo needs it); python3-tk must match this python."; exit 1; }

      - name: Restore game cache
        if: ${{ success() || failure() }}
        id: game_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          fail-on-cache-miss: ${{ env.CACHE_WRITER == 'true' }}
      - name: Look up game backup artifact
        id: game_backup
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/modsync-ci/game_backup.py status --game "$GAME"
      - name: Restore game from backup artifact
        id: game_artifact
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '' && steps.game_backup.outputs.artifact_id != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          ARTIFACT_ID: ${{ steps.game_backup.outputs.artifact_id }}
        run: python tools/modsync-ci/game_backup.py fetch --game "$GAME" --artifact-id "$ARTIFACT_ID" --seal-dir "$RUNNER_TEMP/sealed"
      - name: Require the game
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '' && steps.game_artifact.outputs.restored != 'true') }}
        run: echo "::error::$GAME has no game cache on this ref and no usable game-$GAME-sealed backup artifact; run the game job from main or a manual dispatch to save it (docs/ci.md, Actions cache size and eviction)"; exit 1
      - name: Explain a game cache miss
        if: ${{ (success() || failure()) && (failure() && steps.game_cache.outcome == 'failure') }}
        run: echo "::error::game cache evicted — re-run the game job (then this lane); see docs/ci.md, Actions cache size and eviction"
      - name: Unpack game
        if: ${{ success() || failure() }}
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"
          # Nothing later in this job reads the sealed game; free its space for the install.
          rm -rf -- "$RUNNER_TEMP/sealed"
      - name: Normalize game case
        if: ${{ success() || failure() }}
        run: |
          python tools/modsync-ci/game_cache.py normalize-case --game "$GAME" --game-dir "$RUNNER_TEMP/game" \
            --label "rust ${{ matrix.mode }}"
      - name: Game inventory
        if: ${{ success() || failure() }}
        run: |
          python tools/modsync-ci/game_cache.py inventory --game "$GAME" --game-dir "$RUNNER_TEMP/game" \
            --label "rust ${{ matrix.mode }}"
      - name: Install archive tools
        if: ${{ success() || failure() }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
      - name: Restore mod archive cache
        if: ${{ success() || failure() }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ needs.mods.outputs.archive_cache_key || 'mod-archives-' }}
          restore-keys: mod-archives-
      - name: Restore required mod archives
        if: ${{ success() || failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          # Reviewed policy skips (docs/ci.md). ports.py leaves the skipped components out of
          # the install with --deselect.
          policy=(--allow-uncached-by-policy "Optional Install Assistant - Quicker TSLPatching::Quicker TSLPatching")
          if [[ "$GAME" == k1 ]]; then
            policy+=(--allow-uncached-by-policy "Optional Widescreen & Extended Widescreen Support Mods::Remastered Cutscenes")
          elif [[ "$GAME" == k2 ]]; then
            policy+=(--allow-uncached-by-policy "Enhanced Widescreen Support Mods::K2 Cutscenes Rescaled")
          fi
          remote=()
          if [[ -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID" && -n "$MOD_CACHE_BUCKET" ]]; then
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          fi
          # An archive no source can provide is a warning here, not a failure: the report's
          # unavailable_steps reach ports.py (--restore-report), which deselects those components and
          # their dependents with a warning and installs everything else. Such a lane passes as
          # status "partial" (report omitted_components, a final PARTIAL warning), never "installed";
          # any other component left out fails it (status "incomplete").
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/archive-map.json" --report "$RUNNER_TEMP/restore-report.json" \
            --deselect-unavailable "${policy[@]}" "${remote[@]}"
          # The archives are now in $RUNNER_TEMP/archives and this job never saves the archive
          # cache, so drop the sealed copies to leave disk for the install.
          rm -rf -- "$RUNNER_TEMP/mod-cache"

      - name: Install the full guide
        if: ${{ success() || failure() }}
        env:
          REVIEW: ci/${{ matrix.game }}-rust-review.json
        run: |
          review=(--restore-report "$RUNNER_TEMP/restore-report.json")
          if [[ -f "$REVIEW" ]]; then review+=(--review-manifest "$REVIEW"); fi
          df -h "$RUNNER_TEMP" /
          python tools/modsync-ci/ports.py \
            --implementation rust --mode '${{ matrix.mode }}' \
            --source .modsync-source --guide "content/$GAME/full.md" \
            --game-dir "$RUNNER_TEMP/game" --archives "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/archive-map.json" \
            --work-dir "$RUNNER_TEMP/work" --report "$RUNNER_TEMP/report.json" "${review[@]}"

      - name: Seal lane diagnostics
        if: ${{ (success() || failure()) && (always()) }}
        env:
          DIAGNOSTICS_ENCRYPTION_KEY: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
        run: |
          if [[ -z "$DIAGNOSTICS_ENCRYPTION_KEY" ]]; then
            echo "::warning::DIAGNOSTICS_ENCRYPTION_KEY is not set; the lane report and convert log are not uploaded."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/diagnostics-plain" "$RUNNER_TEMP/diagnostics"
          if [[ -f "$RUNNER_TEMP/report.json" ]]; then cp -- "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/diagnostics-plain/"; fi
          for log in "$RUNNER_TEMP"/work/ports-*/convert.log; do
            if [[ -f "$log" ]]; then cp -- "$log" "$RUNNER_TEMP/diagnostics-plain/"; fi
          done
          CACHE_ENCRYPTION_KEY="$DIAGNOSTICS_ENCRYPTION_KEY" python tools/modsync-ci/seal.py seal \
            --source "$RUNNER_TEMP/diagnostics-plain" --destination "$RUNNER_TEMP/diagnostics/lane-diagnostics.seal"
      - name: Upload sealed lane diagnostics
        if: ${{ (success() || failure()) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: ports-diagnostics-${{ matrix.game }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/diagnostics/lane-diagnostics.seal
          retention-days: 7
          if-no-files-found: ignore
