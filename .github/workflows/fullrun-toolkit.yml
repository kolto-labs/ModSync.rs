name: Full-run tooling contracts
on:
  workflow_call:
    inputs:
      quick: {type: boolean, default: false}
  workflow_dispatch:
permissions: {contents: read}
# Called jobs retain their caller scope; standalone dispatches replace one another.
concurrency:
  group: fullrun-toolkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.quick && 2 || 20 }}
    steps:
      - name: Checkout owned CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install pinned Python test dependencies
        if: ${{ !inputs.quick }}
        run: python -m pip install pykotor==2.3.12 PyYAML==6.0.2
      - name: Verify repository-owned Python tooling and workflow contracts
        if: ${{ !inputs.quick }}
        run: python -m unittest discover -s tools/modsync-ci -p 'test_*.py'
      - name: Quick syntax and configuration checks
        if: ${{ inputs.quick }}
        run: |
          python - <<'PYQUICK'
          import ast,json
          from pathlib import Path
          for path in Path('tools/modsync-ci').rglob('*.py'):
              ast.parse(path.read_bytes(),filename=str(path))
          json.loads(Path('.github/fullrun.json').read_text())
          PYQUICK
      - name: Validate full-run workflow syntax and expressions
        if: ${{ success() || failure() }}
        uses: docker://rhysd/actionlint:1.7.12
        env: {GOMAXPROCS: '2'}
        with:
          args: >-
            -color -config-file .github/actionlint.yaml
            .github/workflows/fullrun.yml .github/workflows/fullrun-toolkit.yml
            .github/workflows/fullrun-pr-contracts.yml
            .github/workflows/fullrun-lane.yml .github/workflows/fullrun-p2p.yml
            .github/workflows/cache-game.yml .github/workflows/cache-archives.yml .github/workflows/cache-seed.yml
