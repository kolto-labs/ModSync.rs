name: Prove four native single-INI K2 recipes
on:
  push:
    branches: [fix/fullrun-ci-credentials]
    paths: [.github/workflows/native-single-ini-ci-proof.yml]
  workflow_dispatch:
    inputs:
      feature_sha:
        description: Reviewed immutable feature commit in this repository
        required: true
        type: string
permissions: {contents: read, actions: read}
jobs:
  component:
    if: github.repository == 'kolto-labs/ModSync.rs' && github.ref == 'refs/heads/fix/fullrun-ci-credentials'
    strategy:
      fail-fast: false
      matrix: {mode: [cli, gui]}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MODE: ${{ matrix.mode }}
      FEATURE_SHA: ${{ inputs.feature_sha || github.sha }}
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Admit immutable feature pin
        run: |
          [[ "$FEATURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$FEATURE_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.feature_sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kolto-labs/mod-builds
          ref: 67dc5fd8da6abde324c51d32eee3d04687070dd6
          path: guide-input
          persist-credentials: false
      - name: Prepare disposable production runtime
        timeout-minutes: 15
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/single-ini-evidence"
          test "$(git rev-parse HEAD)" = "$FEATURE_SHA"
          test "$(git -C guide-input rev-parse HEAD)" = 67dc5fd8da6abde324c51d32eee3d04687070dd6
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends age wine wine64 wine32:i386 xvfb xauth pkg-config libssl-dev zstd openssl python3-tk tesseract-ocr libxkbcommon-x11-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev scrot
          python -m pip install PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
          rustup toolchain install 1.95.0 --profile minimal
      - name: Build actual application without material credentials
        timeout-minutes: 35
        run: |
          flags=()
          if [[ "$MODE" == cli ]]; then flags+=(--no-default-features); fi
          env -i PATH="$PATH" HOME="$HOME" RUSTUP_TOOLCHAIN=1.95.0 \
            CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true \
            cargo build --locked --release --lib --bin modsync -j2 "${flags[@]}" \
            >"$RUNNER_TEMP/single-ini-evidence/build.log" 2>&1
      - name: Recover verified own-repository baseline and seven exact reviewed inputs
        timeout-minutes: 35
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_TOKEN: ${{ github.token }}
          ARTSTORE_REPOSITORY: ${{ github.repository }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import artstore,artstore_client,fullrun_baseline
          root=Path(os.environ['RUNNER_TEMP']); evidence=root/'single-ini-evidence'
          assert os.environ['ARTSTORE_REPOSITORY']==os.environ['GITHUB_REPOSITORY']=='kolto-labs/ModSync.rs'
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for data in iter(lambda:f.read(4*1024*1024),b''): h.update(data)
              return h.hexdigest()
          result=fullrun_baseline.recover('k2',root/'sealed',root/'game',audit_backup=False)
          assert result['available'] and result['origin'].startswith('artifact:current:kolto-labs/ModSync.rs:')
          result['sealed_sha256']=digest(root/'sealed'/'baseline.seal')
          client=artstore_client.from_environment(); index=artstore.load_index(client)
          baseline_id=int(result['origin'].rsplit(':',1)[1])
          baseline_metadata=[a for a in client.list_artifacts() if int(a['id'])==baseline_id]
          assert len(baseline_metadata)==1
          result['baseline_artifact']=baseline_metadata[0]
          selected=[
              {'component_guid':'bee5a72b-d748-8f83-8261-81758a9bfc56','filename':'tslrcm2022.exe','sha256':'94c99c4807da4b304de6e0efed1be55e0f43d13cc5a274582ed3323ac0e2f1a6','size':137947655},
              {'component_guid':'9c5bbc49-daa8-89be-8f27-8428d8fa24b8','filename':'Silent Sion Restoration.zip','sha256':'b3e5c90f8001a299fdc3464ff74edc98c9e19a11e7759a8095a0cef508782789','size':12852},
              {'component_guid':'e8501df3-9a84-8f60-988c-15f30ca01af7','filename':'KOTOR2-Citadel-Station-Backdrop_v2.0.0_4k.zip','sha256':'ddaae12569dd7cf29d9097f7ff15a773b55cb2b80237b01310b27bc49c4dccbd','size':2887658},
          ]
          book_path=Path('src/archive_generation/reviewed_manual_single_ini_k2.json')
          assert digest(book_path)=='2eee9ca0321722919306743903b18a872c1be1954c547963b3a737a270679fbe'
          book=json.loads(book_path.read_text()); assert len(book['recipes'])==4
          for recipe in book['recipes']:
              assert len(recipe['archives'])==1
              pin=recipe['archives'][0]; record=index['blobs'][pin['sha256']]
              assert 0<record['size']<=50*1024*1024
              selected.append({'component_guid':recipe['component_guid'],'filename':pin['filename'],
                               'sha256':pin['sha256'],'size':record['size']})
          archives=root/'archives'; archives.mkdir(mode=0o700)
          material=[]; packs={}
          for item in selected:
              sha=item['sha256']; record=index['blobs'][sha]; assert record['size']==item['size']
              destination=archives/item['filename']
              assert artstore.fetch(sha,destination,client=client,index=index,workdir=root/'parts')
              assert destination.is_file() and not destination.is_symlink()
              assert destination.stat().st_size==item['size'] and digest(destination)==sha
              material.append({**item,'blob':record})
              packs.update({part['pack']:index['packs'][part['pack']] for part in record['parts']})
          result.update(installer=material[0]['blob'],component_materials=material,packs=packs)
          (evidence/'material-provenance.json').write_text(json.dumps(result,indent=2))
          PY
      - name: Run actual seven-component binding, independent replay and native installation
        timeout-minutes: 30
        run: |
          env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" MODE="$MODE" FEATURE_SHA="$FEATURE_SHA" \
            python - <<'PY'
          import copy,hashlib,json,os,shutil,struct,subprocess,sys,time
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import gui_rust
          root=Path(os.environ['RUNNER_TEMP']); evidence=root/'single-ini-evidence'
          binary=Path('target/release/modsync').resolve(); game=root/'game'; archives=root/'archives'
          guids=['bee5a72b-d748-8f83-8261-81758a9bfc56','9c5bbc49-daa8-89be-8f27-8428d8fa24b8','e8501df3-9a84-8f60-988c-15f30ca01af7']; guide=Path('guide-input/content/k2/full.md')
          native_guids=['f88f9af8-050f-811c-814b-706cb9466483','b83b224a-3c42-83d5-85f4-c89df4a263ae',
                        'f27d4b13-b349-8c56-b9b7-620cdc133579','ee2b251b-720d-8f69-9d38-5a56310f0bb4']
          guids += native_guids

          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for data in iter(lambda:f.read(4*1024*1024),b''): h.update(data)
              return h.hexdigest()
          report={'scope':'four single-INI native translations plus TSLRCM and two file-effect predecessors, in original guide order; not a full-guide or merge proof','mode':os.environ['MODE'],
                  'engine_sha':os.environ['FEATURE_SHA'],'binary_sha256':digest(binary),'stages':[],'status':'running'}
          def save(): (evidence/'native-proof.json').write_text(json.dumps(report,indent=2))
          def run(label,command,timeout=1200):
              start=time.monotonic()
              with (evidence/(label+'.log')).open('wb') as log:
                  p=subprocess.run(list(map(str,command)),stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,timeout=timeout)
              report['stages'].append({'name':label,'exit_code':p.returncode,'seconds':time.monotonic()-start}); save()
              assert p.returncode==0,label
          def projected_components(path):
              values=json.loads(path.read_text())
              if isinstance(values,dict):
                  assert values['ModSyncSourceOrder']==guids
                  values=values['thisMod']
              assert isinstance(values,list) and len(values)==7
              assert [component['Guid'] for component in values]==guids
              return values
          try:
              assert digest(guide)=='f442bdf574031623ed577609730d887069b9bc8e38e8e2f38ecc43a7e7487d5f'
              report['guide_sha256']=digest(guide)
              run('normalize-baseline',[sys.executable,'tools/modsync-ci/game_cache.py','normalize-case','--game','k2','--game-dir',game,'--label','vendor-component'])
              with (game/'dialog.tlk').open('rb') as f: header=f.read(12)
              assert header[:8]==b'TLK V3.0' and struct.unpack('<I',header[8:])[0]==0
              report['baseline_dialog_sha256']=digest(game/'dialog.tlk')
              whole=evidence/'whole.json'; projected=evidence/'component.json'; bound=evidence/'bound.json'; reviewed=evidence/'reviewed.json'; model=evidence/'reviewed.toml'
              run('whole-convert',[binary,'convert',guide,whole,'--format','json','--parse-directions'])
              components=json.loads(whole.read_text()); matches=[(i,c) for i,c in enumerate(components) if c['Guid'] in guids]
              assert len(components)==151 and len(matches)==7 and {c['Guid'] for i,c in matches}==set(guids)
              guids=[c['Guid'] for i,c in matches]
              assert guids[0]=='bee5a72b-d748-8f83-8261-81758a9bfc56'
              selected=[copy.deepcopy(c) for i,c in matches]
              projected.write_text(json.dumps(selected,indent=2)); assert projected_components(projected)==selected
              report.update(original_component_indices=[i for i,c in matches],full_component_count=len(components),component_guids=guids,projection_sha256=digest(projected))
              canonical=evidence/'component-canonical.json'
              run('canonical-input-export',[binary,'convert',projected,canonical,'--format','json'])
              admitted=projected_components(canonical)
              vendor_source=Path('src/vendor_installer.rs').read_text()
              vendor_raw=json.loads(vendor_source.split('const REVIEWED_INPUT: &str = r###"',1)[1].split('"###;',1)[0])
              assert selected[0]==vendor_raw
              assert {k:v for k,v in admitted[0].items() if k!='Language'}=={k:v for k,v in selected[0].items() if k!='Language'}
              specs=[('reviewed_manual_k2.json','f85240122267d088f7b52c1746c2edb2fdb8795846889f4158dcf59b4fd91d60'),
                     ('reviewed_manual_single_ini_k2.json','2eee9ca0321722919306743903b18a872c1be1954c547963b3a737a270679fbe')]
              recipes={}; book_identities={}
              for filename,sha in specs:
                  book_path=Path('src/archive_generation')/filename
                  assert digest(book_path)==sha
                  book=json.loads(book_path.read_text()); assert book['source_guide_sha256']==digest(guide)
                  for recipe in book['recipes']:
                      guid=recipe['component_guid']
                      if guid in guids[1:]:
                          assert guid not in recipes
                          recipes[guid]=recipe; book_identities[guid]=(filename,sha)
              assert set(recipes)==set(guids[1:])
              for original,loaded in zip(selected[1:],admitted[1:]):
                  recipe=recipes[original['Guid']]
                  assert original==recipe['raw_input_component'] and loaded==recipe['canonical_input_component']
              report['canonical_component_sha256']=digest(canonical)
              groups=[{'componentGuid':guids[0],'filenames':['tslrcm2022.exe'],'sha256':'94c99c4807da4b304de6e0efed1be55e0f43d13cc5a274582ed3323ac0e2f1a6','sizeBytes':137947655,'vendorLanguage':'english'}]
              for guid in guids[1:]:
                  recipe=recipes[guid]; names=[item['filename'] for item in recipe['archives']]
                  assert len(names)==1
                  path=archives/names[0]
                  assert digest(path)==recipe['archives'][0]['sha256']
                  groups.append({'componentGuid':guid,'filenames':names,'sha256':digest(path),'sizeBytes':path.stat().st_size})
              plan=evidence/'resolved.json'; plan.write_text(json.dumps(groups,indent=2))
              run('bind',[binary,'convert',projected,bound,'--format','json','--source-path',archives,'--resolved-archives',plan])
              generated=projected_components(bound)
              assert all(component['DraftReview']['RequiresReview'] is True for component in generated)
              assert generated[0]['VendorInstallerBinding']['InputComponent']==admitted[0] and len(generated[0]['Instructions'])==1
              for component,context in zip(generated[1:],admitted[1:]):
                  binding=component['AuthoredRecipeBinding']
                  assert binding['InputComponent']==context and binding['Recipe']==recipes[component['Guid']]
                  assert binding['DatabookSha256']==book_identities[component['Guid']][1]
                  if component['Guid'] in native_guids:
                      assert binding['Kind']=='ReviewedManualK2NativePatcher'
                      assert component['DraftReview']['Generator']=='reviewed-manual-native-patcher'
                      assert [op['Action'] for op in component['Instructions']]==['ExtractTo','Patcher']
                      assert component['Instructions'][1]['Arguments']=='changes.ini'
                      assert component['Instructions'][1]['Destination']=='<<kotorDirectory>>'
              run('independent-replay',[binary,'convert',bound,reviewed,'--format','json','--source-path',archives,'--review-verified-drafts'])
              final=projected_components(reviewed)
              for component,original in zip(final,generated):
                  assert component['DraftReview']['RequiresReview'] is False
                  verification=component['DraftReview']['Verification']
                  assert verification['Reviewer']=='modsync-ci-tool' and verification['IdentityVersion']==2
                  if component['Guid'] in book_identities:
                      filename,sha=book_identities[component['Guid']]
                      assert verification['ArchiveFilename']==filename and verification['ArchiveSha256']==sha
                  assert {k:v for k,v in component.items() if k!='DraftReview'}=={k:v for k,v in original.items() if k!='DraftReview'}
              run('native-model-export',[binary,'convert',reviewed,model,'--format','toml'])
              # Explicit guide order survives native dependency sorting without changing owners.
              original_model=model.read_text(); model.write_text('ModSyncSourceOrder = '+json.dumps(guids)+'\n\n'+original_model)
              roundtrip=evidence/'reviewed-roundtrip.json'
              run('native-model-roundtrip',[binary,'convert',model,roundtrip,'--format','json'])
              assert projected_components(roundtrip)==final
              report['toml_reload_review_controls']=[]
              for index,guid in enumerate(guids):
                  label='toml-draft-review-'+str(index)
                  run(label,[binary,'guide-draft-review',model,guid])
                  control=json.loads((evidence/(label+'.log')).read_text())
                  assert control['requiresReview'] is False
                  report['toml_reload_review_controls'].append({'component_guid':guid,'requires_review':False})
              requests=root/'execute-requests'; requests.mkdir(mode=0o700); prefix=requests/'wine-prefix'; prefix.mkdir(mode=0o700)
              runner=['--execute-request-dir',str(requests),'--execute-wine-prefix',str(prefix)]
              for flag,program in [('execute-xvfb','Xvfb'),('execute-wine','wine'),('execute-wineserver','wineserver')]:
                  runner += ['--'+flag,str(Path(shutil.which(program)).resolve(strict=True))]
              arguments=['--input',model,'--game-dir',game,'--source-dir',archives,'--allow-processes',*runner]
              run('validate',[binary,'validate',*arguments])
              if os.environ['MODE']=='cli': run('native-install',[binary,'install',*arguments],1500)
              else:
                  run('native-gui',[sys.executable,'tools/modsync-ci/gui_rust.py','--binary',binary,'--input',model,'--game-dir',game,'--archives',archives,'--work-dir',root/'gui-work','--report',evidence/'gui-report.json','--timeout','1500','--complete-guide',*runner],1550)
              # Existing production receipt verifier checks every game byte and full file set.
              from types import SimpleNamespace
              receipt={}; gui_rust.verify_receipt(SimpleNamespace(game_dir=game,archives=archives),receipt,lambda:None,guids)
              state=game.parent/('.modsync-'+hashlib.sha256(os.fsencode(str(game))).hexdigest()[:16])
              completion=json.loads((state/'completion.json').read_text())
              assert [component['Guid'].lower() for component in completion['components']]==guids
              checkpoint=completion['installReport']['checkpoint']
              assert isinstance(checkpoint,dict) and checkpoint['sessionId'] and checkpoint['checkpointId']
              assert isinstance(checkpoint['generation'],int) and checkpoint['generation']>0
              assert not (state/'external-writers-v1.json').exists()
              assert not list((state/'checkpoints-v1'/'operations').glob('*.json'))
              report['checkpoint']=checkpoint
              report['completion']=receipt
              # The native contracts check fresh success logs and actual changed game
              # manifests per Patcher. Later patchers may legitimately alter vendor outputs.
              if os.environ['MODE']=='cli':
                  outcome_logs=[evidence/'native-install.log']
              else:
                  settings=list((root/'gui-work').glob('gui-rust-*/settings'))
                  assert len(settings)==1 and settings[0].is_dir() and not settings[0].is_symlink()
                  outcome_logs=sorted((settings[0]/'Logs').glob('kotormodsync_*.log'))
                  assert outcome_logs and len(outcome_logs)<=8
                  assert all(path.resolve().is_relative_to(settings[0].resolve()) for path in outcome_logs)
              outcomes=[]; receipt_bytes={}
              for path in outcome_logs:
                  assert path.is_file() and not path.is_symlink() and path.stat().st_size<=64*1024*1024
                  for line in path.read_text(errors='strict').splitlines():
                      marker='Reviewed native Patcher outcome: '
                      if marker in line:
                          payload=line.split(marker,1)[1]
                          receipt,end=json.JSONDecoder().raw_decode(payload)
                          raw=payload[:end]; guid=receipt['ComponentGuid']
                          assert guid in native_guids
                          if guid in receipt_bytes:
                              assert receipt_bytes[guid]==raw, 'conflicting duplicate native outcome'
                              continue
                          receipt_bytes[guid]=raw; outcomes.append(receipt)
              assert len(outcomes)==4
              assert [outcome['ComponentGuid'] for outcome in outcomes]==[guid for guid in guids if guid in native_guids]
              for outcome in outcomes:
                  assert outcome['Contract']=='native-zero-warnings-changed-game-v1'
                  assert outcome['Failed']==outcome['Warnings']==outcome['Errors']==0
                  assert outcome['Added']+outcome['Removed']+outcome['Changed']>0
                  assert outcome['BeforeManifestSha256']!=outcome['AfterManifestSha256']
                  assert 0<outcome['LogBytes']<=8*1024*1024 and len(outcome['LogSha256'])==64
              report.update(status='installed',native_patcher_outcomes=outcomes,
                  component_reviews={component['Guid']:component['DraftReview'] for component in final},
                  vendor_binding=final[0]['VendorInstallerBinding'],
                  authored_recipe_bindings={component['Guid']:component['AuthoredRecipeBinding'] for component in final[1:]})
          except BaseException as error:
              report.update(status='failed',failure_category=type(error).__name__); raise
          finally:
              # Bounded ownership metadata diagnoses failures without retaining captured roots/CAS.
              state=game.parent/('.modsync-'+hashlib.sha256(os.fsencode(str(game))).hexdigest()[:16])
              candidates=[state/'external-writers-v1.json',state/'checkpoints-v1'/'active.json']
              candidates.extend(sorted((state/'checkpoints-v1'/'operations').glob('*.json'))[:16])
              for index,path in enumerate(candidates):
                  if path.is_symlink() or not path.is_file() or path.stat().st_size>4*1024*1024: continue
                  if not path.resolve().is_relative_to(state.resolve()): continue
                  shutil.copyfile(path,evidence/('checkpoint-'+str(index)+'-'+path.name))
              # Allowlisted GUI metadata only; never copy game, archives, prefix or build trees.
              total=0
              if (root/'gui-work').is_dir():
                  for index,path in enumerate(sorted((root/'gui-work').rglob('*'))):
                      if path.is_symlink() or not path.is_file() or path.suffix not in ('.log','.json','.png'): continue
                      if not path.resolve().is_relative_to((root/'gui-work').resolve()): continue
                      size=path.stat().st_size
                      if size>16*1024*1024 or total+size>64*1024*1024: continue
                      shutil.copyfile(path,evidence/('gui-'+str(index)+'-'+path.name)); total+=size
              log=archives/'modsync-tslrcm-english-setup.log'
              if log.is_file() and not log.is_symlink() and log.stat().st_size<=4*1024*1024: shutil.copyfile(log,evidence/'vendor-setup.log')
              save()
          PY
      - name: Retain only encrypted component evidence
        if: success() || failure()
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/single-ini-evidence
          name: native-single-ini-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-recipient: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
