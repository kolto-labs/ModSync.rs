name: PR tooling contracts (no installation coverage)
# Untrusted PR code is checked only on hosted runners with a read-only token,
# no inherited secrets, and no calls to licensed producers or installation lanes.
on:
  pull_request:
permissions: {contents: read}
concurrency:
  group: fullrun-pr-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  toolkit:
    if: github.event.pull_request.head.repo.full_name != github.repository
    name: Credential-free tooling contracts
    uses: ./.github/workflows/fullrun-toolkit.yml
    permissions: {contents: read}
