name: Full-run Rust installation lane
on:
  workflow_call:
    inputs:
      install_profile: {type: string, default: minimal}
      download_mode: {type: string, default: cache-first}
      engine_repository: {type: string, required: true}
      engine_sha: {type: string, required: true}
      guide_repository: {type: string, required: true}
      guide_sha: {type: string, required: true}
      game: {type: string, required: true}
      mode: {type: string, required: true}
      patcher_backend: {type: string, default: ody-patcher}
      plan_id: {type: string, required: true}
      archive_cache_key: {type: string, default: ''}
      artifact_repository: {type: string, default: ''}
    secrets:
      MODSYNC_SOURCE_TOKEN: {required: false}
      ARTSTORE_READ_TOKEN: {required: false}
      CACHE_ENCRYPTION_KEY: {required: true}
      DIAGNOSTICS_ENCRYPTION_KEY: {required: false}
      MOD_CACHE_S3_READ_ACCESS_KEY_ID: {required: false}
      MOD_CACHE_S3_READ_SECRET_ACCESS_KEY: {required: false}
      MOD_CACHE_S3_ENDPOINT: {required: false}
env:
  DIAGNOSTICS_ENCRYPTION_RECIPIENT: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
permissions: {contents: read, actions: read}
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GAME: ${{ inputs.game }}
      MODE: ${{ inputs.mode }}
      PATCHER_ENGINE: ${{ inputs.patcher_backend }}
      PLAN_ID: ${{ inputs.plan_id }}
      INSTALL_PROFILE: ${{ inputs.install_profile }}
      DOWNLOAD_MODE: ${{ inputs.download_mode }}
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Checkout owned CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check install-stage credentials before materialization
        id: admission
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          DIAGNOSTICS_ENCRYPTION_KEY: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
        run: python tools/modsync-ci/fullrun_contract.py check-credentials --stage install
      - name: Checkout admitted guides
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.guide_repository }}
          ref: ${{ inputs.guide_sha }}
          path: guide-input
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify actual engine and guide identities
        env:
          ENGINE_SHA: ${{ inputs.engine_sha }}
          GUIDE_SHA: ${{ inputs.guide_sha }}
          ARTSTORE_REPOSITORY: ${{ inputs.artifact_repository || github.repository }}
        run: |
          python tools/modsync-ci/fullrun_stage.py identity --engine . --guides guide-input \
            --engine-sha "$ENGINE_SHA" --guide-sha "$GUIDE_SHA" --output "$RUNNER_TEMP/lane-evidence/identity.json"
      - name: Reserve space on the disposable hosted runner
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
          echo "FULLRUN_STORAGE_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare native production runtime
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          packages=(age 7zip 7zip-rar unrar megatools libarchive-tools pkg-config libssl-dev)
          if [[ "$INSTALL_PROFILE" == exhaustive ]]; then packages+=(btrfs-progs); fi
          if [[ "$GAME" == k2 || "$PATCHER_ENGINE" != ody-patcher ]]; then
            sudo dpkg --add-architecture i386
            packages+=(wine wine64 wine32:i386 xvfb xauth)
          fi
          if [[ "$PATCHER_ENGINE" == mod-packaged ]]; then
            packages+=(xdotool tesseract-ocr scrot gcc-mingw-w64-i686)
          fi
          if [[ "$MODE" == gui ]]; then
            packages+=(xvfb xauth python3-tk tesseract-ocr libxkbcommon-x11-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev scrot)
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          if [[ -n "$DIAGNOSTICS_ENCRYPTION_RECIPIENT" ]]; then
            age --encrypt --recipient "$DIAGNOSTICS_ENCRYPTION_RECIPIENT" </dev/null >/dev/null
          fi
          python -m pip install pykotor==2.3.12 gdown==5.2.0
          if [[ "$PATCHER_ENGINE" == holo-patcher ]]; then
            python -m pip install loggerplus==0.1.3 ply==3.11 charset-normalizer==3.5.2 defusedxml==0.7.1
            python tools/modsync-ci/bootstrap_holopatcher.py --directory "$RUNNER_TEMP/holopatcher-resources" \
              --logs "$RUNNER_TEMP/lane-evidence/holopatcher-bootstrap"
          fi
          if [[ "$PATCHER_ENGINE" == mod-packaged ]]; then
            python -m pip install pytesseract==0.3.13 Pillow==11.3.0
          fi
          python tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Install native GUI input libraries
        if: ${{ inputs.mode == 'gui' }}
        run: |
          python -m pip install PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
          python -c 'import tkinter'
      - name: Prefetch locked engine dependencies without persistent Git credentials
        working-directory: .
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_token=${SOURCE_TOKEN:-}
          export -n source_token
          unset SOURCE_TOKEN GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          unset GIT_ASKPASS SSH_ASKPASS GIT_CURL_VERBOSE GIT_CONFIG_PARAMETERS
          for trace_name in "${!GIT_TRACE@}"; do unset "$trace_name"; done
          for config_name in "${!GIT_CONFIG_KEY_@}" "${!GIT_CONFIG_VALUE_@}"; do unset "$config_name"; done
          auth_dir=$(mktemp -d "$RUNNER_TEMP/fullrun-source-auth.XXXXXX")
          cfg="$auth_dir/gitconfig"
          retry_log="$auth_dir/fetch.log"
          trap 'rm -rf -- "$auth_dir"' EXIT
          : > "$cfg"
          export GIT_CONFIG_GLOBAL="$cfg" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_COUNT=0
          export GIT_TERMINAL_PROMPT=0 GIT_TRACE_REDACT=1 CARGO_NET_GIT_FETCH_WITH_CLI=true
          if cargo fetch --locked; then
            unset source_token
            exit 0
          fi
          if [[ -z "$source_token" ]]; then
            echo "::error::Anonymous dependency fetch failed; optional MODSYNC_SOURCE_TOKEN is needed only for private source access."
            exit 1
          fi
          # The optional token reaches only the private temporary Git config,
          # never a child environment or this config writer's argument vector.
          if ! printf '%s' "$source_token" | python -c 'import sys, urllib.parse; token = urllib.parse.quote(sys.stdin.read(), safe=""); print("[url \"https://x-access-token:" + token + "@github.com/\"]\n\tinsteadOf = https://github.com/")' > "$cfg" 2> "$retry_log"; then
            echo "::error::Optional source credential configuration failed. Private output was withheld."
            exit 1
          fi
          unset source_token
          if ! cargo fetch --locked > "$retry_log" 2>&1; then
            echo "::error::Authenticated dependency fallback failed; verify optional MODSYNC_SOURCE_TOKEN access. Private fetch output was withheld."
            exit 1
          fi
      - name: Prepare private copy-on-write storage for exhaustive installs
        id: storage
        if: inputs.install_profile == 'exhaustive'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1)
          capacity=$((available - 6 * 1024 * 1024 * 1024))
          if (( capacity < 40 * 1024 * 1024 * 1024 )); then
            echo '::error::Exhaustive installation needs at least 40 GiB after reserving 6 GiB for the host.'
            exit 1
          fi
          image=$(mktemp "$RUNNER_TEMP/fullrun-storage.XXXXXX.img")
          storage_root=$(mktemp -d "$RUNNER_TEMP/fullrun-storage.XXXXXX")
          truncate --size "$capacity" "$image"
          mkfs.btrfs -q -f "$image"
          sudo mount -o loop,compress=zstd:1 "$image" "$storage_root"
          sudo chown "$(id -u):$(id -g)" "$storage_root"
          chmod 700 "$storage_root"
          mkdir "$storage_root/scratch"
          echo "FULLRUN_STORAGE_ROOT=$storage_root" >> "$GITHUB_ENV"
          echo "TMPDIR=$storage_root/scratch" >> "$GITHUB_ENV"
          echo "root=$storage_root" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          df -h "$storage_root"
      - name: Restore sealed game accelerator
        id: game_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ inputs.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ inputs.game }}-Linux-
      - name: Recover and verify the lane-local game baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_READ_TOKEN: ${{ secrets.ARTSTORE_READ_TOKEN }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          LEGACY_REPOSITORY: ${{ inputs.artifact_repository }}
        run: |
          python tools/modsync-ci/fullrun_baseline.py --game "$GAME" \
            --seal-dir "$RUNNER_TEMP/sealed" --game-dir "$FULLRUN_STORAGE_ROOT/game" \
            --legacy-repository "$LEGACY_REPOSITORY" --consumer --required
          python tools/modsync-ci/game_cache.py normalize-case --game "$GAME" --game-dir "$FULLRUN_STORAGE_ROOT/game" --label "$MODE"
          rm -rf -- "$RUNNER_TEMP/sealed"
      - name: Restore archive accelerator
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ inputs.archive_cache_key || 'mod-archives-' }}
          restore-keys: mod-archives-
      - name: Resolve exact K1 auxiliary cache identity
        id: k1-public-key
        if: inputs.game == 'k1'
        run: |
          python - <<'PYKEY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import fullrun_stage,k1_widescreen_inputs as inputs
          applicable=(os.environ['GITHUB_REPOSITORY']=='kolto-labs/ModSync.rs'
              and fullrun_stage.native_k1_scope(Path('guide-input')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('applicable='+str(applicable).lower()+'\n')
              if applicable:
                  identity='k1-widescreen-public-v1-'+inputs.PROFILE_SHA256+'-'+inputs.GALAXY_PROFILE_SHA256
                  output.write('key='+identity+'\n')
          PYKEY
      - name: Restore exact K1 auxiliary cache independently of its producer
        if: steps.k1-public-key.outputs.applicable == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache/k1-widescreen-inputs
          key: ${{ steps.k1-public-key.outputs.key }}
      - name: Install the admitted full guide and require complete coverage
        id: installation
        env:
          ARTSTORE_REPOSITORY: ${{ inputs.artifact_repository || github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_TOKEN: ${{ (!inputs.artifact_repository || inputs.artifact_repository == github.repository) && github.token || secrets.ARTSTORE_READ_TOKEN }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ vars.MOD_CACHE_BUCKET && secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID || '' }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ vars.MOD_CACHE_BUCKET && secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY || '' }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT || vars.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          if [[ -z "${MOD_CACHE_BUCKET:-}" ]]; then
            unset RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY RCLONE_CONFIG_MODCACHE_ENDPOINT
          fi
          backend_options=(--patcher-engine "$PATCHER_ENGINE")
          if [[ "$PATCHER_ENGINE" == holo-patcher ]]; then
            backend_options+=(--patcher "$RUNNER_TEMP/holopatcher-resources")
          fi
          python tools/modsync-ci/fullrun_stage.py install --engine . --guides guide-input \
            --game "$GAME" --mode "$MODE" --game-dir "$FULLRUN_STORAGE_ROOT/game" \
            --cache "$RUNNER_TEMP/mod-cache" --work-dir "$FULLRUN_STORAGE_ROOT/lane-work" --output "$RUNNER_TEMP/lane-evidence" \
            --prune-restored-object-cache --install-profile "$INSTALL_PROFILE" --download-mode "$DOWNLOAD_MODE" \
            "${backend_options[@]}"
      - name: Compress complete comparison manifests
        if: steps.installation.outcome == 'success'
        run: |
          python tools/modsync-ci/patcher_comparison_artifacts.py pack \
            --source "$RUNNER_TEMP/lane-evidence/patcher-comparison" --output-dir "$RUNNER_TEMP/comparison-transport"
      - name: Retain encrypted comparison manifests for the same-run comparison job
        if: steps.installation.outcome == 'success'
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/comparison-transport
          name: comparison-${{ inputs.game }}-${{ inputs.patcher_backend }}-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-key: ${{ secrets.CACHE_ENCRYPTION_KEY }}
      - name: Retain encrypted lane evidence
        if: ${{ (success() || failure()) && steps.admission.outcome == 'success' }}
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/lane-evidence
          name: fullrun-${{ inputs.game }}-${{ inputs.patcher_backend }}-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-key: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
          encryption-recipient: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
      - name: Release disposable exhaustive storage
        if: ${{ always() && steps.storage.outcome == 'success' }}
        env:
          STORAGE_ROOT: ${{ steps.storage.outputs.root }}
          STORAGE_IMAGE: ${{ steps.storage.outputs.image }}
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "FULLRUN_STORAGE_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo umount -- "$STORAGE_ROOT"
          rm -- "$STORAGE_IMAGE"
          rmdir -- "$STORAGE_ROOT"
