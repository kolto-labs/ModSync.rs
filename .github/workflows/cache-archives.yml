# Repository-owned archive producer. Retired pack publication/renewal stays retired.
# Existing generations are read-only recovery inputs; no cache deletion is performed.
name: Full-run archive preparation
on:
  workflow_call:
    inputs:
      install_profile: {type: string, default: minimal}
      download_mode: {type: string, default: cache-first}
      guide_repository: {type: string, required: true}
      guide_sha: {type: string, required: true}
      games: {type: string, default: '["k1","k2"]'}
      cache_writer: {type: boolean, default: false}
      artifact_repository: {type: string, default: ''}
    outputs:
      download_validation:
        description: Whether every requested refresh was attempted with verified acquisition or cache fallback
        value: ${{ jobs.archives.outputs.download_validation }}
      archive_cache_key:
        description: Exact verified producer cache key; empty on producer failure
        value: ${{ jobs.archives.outputs.archive_cache_key }}
    secrets:
      DIAGNOSTICS_ENCRYPTION_KEY: {required: false}
      ARTSTORE_READ_TOKEN: {required: false}
      CACHE_ENCRYPTION_KEY: {required: false}
      MOD_CACHE_S3_READ_ACCESS_KEY_ID: {required: false}
      MOD_CACHE_S3_READ_SECRET_ACCESS_KEY: {required: false}
      MOD_CACHE_S3_ENDPOINT: {required: false}
env:
  DIAGNOSTICS_ENCRYPTION_RECIPIENT: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
permissions: {contents: read, actions: read}
jobs:
  archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      download_validation: ${{ steps.refresh.outputs.download_validation }}
      archive_cache_key: ${{ steps.refresh.outputs.archive_cache_key }}
    steps:
      - name: Checkout owned CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check archive-stage credentials before acquisition
        id: admission
        env:
          DIAGNOSTICS_ENCRYPTION_KEY: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
        run: python tools/modsync-ci/fullrun_contract.py check-credentials --stage archives
      - name: Checkout admitted guides
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.guide_repository }}
          ref: ${{ inputs.guide_sha }}
          path: guide-input
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reclaim unused hosted SDK space for selected archives
        run: sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age 7zip 7zip-rar unrar megatools libarchive-tools
          if [[ -n "$DIAGNOSTICS_ENCRYPTION_RECIPIENT" ]]; then
            age --encrypt --recipient "$DIAGNOSTICS_ENCRYPTION_RECIPIENT" </dev/null >/dev/null
          fi
          python -m pip install gdown==5.2.0
          python tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Restore existing archive accelerator
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache
          key: mod-archives-
          restore-keys: mod-archives-
      - name: Prepare applicable exact K1 public-input identity
        id: k1-public-key
        env:
          REQUESTED_GAMES: ${{ inputs.games }}
        run: |
          python - <<'PYKEY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import fullrun_stage,k1_widescreen_inputs as inputs
          games=json.loads(os.environ['REQUESTED_GAMES'])
          assert isinstance(games,list) and all(game in ('k1','k2') for game in games)
          applicable=(os.environ['GITHUB_REPOSITORY']=='kolto-labs/ModSync.rs'
              and 'k1' in games and fullrun_stage.native_k1_scope(Path('guide-input')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('applicable='+str(applicable).lower()+'\n')
              if applicable:
                  identity='k1-widescreen-public-v1-'+inputs.PROFILE_SHA256+'-'+inputs.GALAXY_PROFILE_SHA256
                  output.write('key='+identity+'\n')
          PYKEY
      - name: Restore exact K1 six-public-input accelerator
        id: k1-public-cache
        if: ${{ steps.k1-public-key.outputs.applicable == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache/k1-widescreen-inputs
          key: ${{ steps.k1-public-key.outputs.key }}
      - name: Verify requested archive inputs
        id: refresh
        env:
          GAMES: ${{ inputs.games }}
          INSTALL_PROFILE: ${{ inputs.install_profile }}
          DOWNLOAD_MODE: ${{ inputs.download_mode }}
          ARTSTORE_REPOSITORY: ${{ inputs.artifact_repository || github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_TOKEN: ${{ (!inputs.artifact_repository || inputs.artifact_repository == github.repository) && github.token || secrets.ARTSTORE_READ_TOKEN }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ vars.MOD_CACHE_BUCKET && secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID || '' }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ vars.MOD_CACHE_BUCKET && secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY || '' }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT || vars.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          if [[ -z "${MOD_CACHE_BUCKET:-}" ]]; then
            unset RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY RCLONE_CONFIG_MODCACHE_ENDPOINT
          fi
          python tools/modsync-ci/fullrun_stage.py refresh --guides guide-input --games "$GAMES" \
            --cache "$RUNNER_TEMP/mod-cache" --output "$RUNNER_TEMP/archive-evidence" \
            --install-profile "$INSTALL_PROFILE" --download-mode "$DOWNLOAD_MODE"
      # First P2P test: each pinned version (bytes and name) has one creatable info hash.
      # No torrent session, peer or credential is involved; transfer is the separate p2p job.
      - name: Create the P2P identity of every pinned archive version
        id: p2p-identity
        # Also after a failed acquisition: bytes already verified in the object cache keep
        # their identity, and one unreachable mod site must not hide every other receipt.
        if: ${{ (success() || failure()) && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure') }}
        env:
          GAMES: ${{ inputs.games }}
        run: |
          python - <<'PYIDENTITY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import torrent_identity
          games=json.loads(os.environ['GAMES'])
          assert isinstance(games,list) and games and all(game in ('k1','k2') for game in games)
          root,fixtures=Path(os.environ['RUNNER_TEMP']),Path('tools/modsync-ci/fixtures/ci')
          codes=[]
          for game in games:
              receipt=root/'p2p-identity'/(game+'-p2p-identity.json')
              if receipt.is_file() and not receipt.is_symlink():
                  # Written by the archive stage before it trimmed the object cache.
                  result=json.loads(receipt.read_text())
                  print(json.dumps({key:result.get(key) for key in ('status','plan','pinned_archives','counts','problems')},sort_keys=True))
                  codes.append(0 if result.get('status')=='passed' else 1)
              else:
                  # The stage stopped before that point: use whatever verified bytes remain.
                  codes.append(torrent_identity.main(['survey','--plan',str(fixtures/(game+'-manual-plan.json')),
                      '--pins',str(fixtures/(game+'-p2p-identity.json')),'--objects',str(root/'mod-cache'/'objects'),
                      '--receipt',str(receipt)]))
          sys.exit(max(codes))
          PYIDENTITY
      - name: Upload public P2P identity receipt
        if: ${{ (success() || failure()) && steps.p2p-identity.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2p-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2p-identity
          if-no-files-found: warn
          retention-days: 14
      - name: Admit only the six verified public objects for auxiliary caching
        id: k1-public-ready
        if: ${{ inputs.cache_writer && startsWith(github.ref, 'refs/heads/') && steps.refresh.outcome == 'success' && steps.k1-public-key.outputs.applicable == 'true' && steps.k1-public-cache.outputs.cache-hit != 'true' }}
        run: |
          python - <<'PYCACHE'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/modsync-ci')
          import fullrun_stage,k1_widescreen_inputs as inputs
          root=Path(os.environ['RUNNER_TEMP'])
          assert fullrun_stage.native_k1_scope(Path('guide-input'))
          result=json.loads((root/'archive-evidence'/'k1-native-inputs.json').read_text())
          assert result['ok'] is True and len(result['entries'])==6
          assert result['profile_sha256']==inputs.PROFILE_SHA256
          assert result['galaxy_profile_sha256']==inputs.GALAXY_PROFILE_SHA256
          assert result['source_guide_sha256']==inputs.GUIDE_SHA256
          auxiliary=root/'mod-cache'/'k1-widescreen-inputs'
          expected={entry['sha256']:entry['bytes'] for entry in result['entries']}
          assert len(expected)==6 and {path.name for path in auxiliary.iterdir()}=={'objects'}
          objects=auxiliary/'objects'; assert objects.is_dir() and not objects.is_symlink()
          assert {path.name for path in objects.iterdir()}==set(expected)
          for path in objects.iterdir():
              assert path.is_file() and not path.is_symlink() and path.stat().st_size==expected[path.name]
          PYCACHE
      - name: Save exact verified K1 six-public-input accelerator
        if: ${{ inputs.cache_writer && startsWith(github.ref, 'refs/heads/') && steps.refresh.outcome == 'success' && steps.k1-public-key.outputs.applicable == 'true' && steps.k1-public-ready.outcome == 'success' && steps.k1-public-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache/k1-widescreen-inputs
          key: ${{ steps.k1-public-key.outputs.key }}
      - name: Save verified public mod archive accelerator
        if: ${{ inputs.cache_writer && steps.refresh.outcome == 'success' && steps.refresh.outputs.archive_cache_key != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ steps.refresh.outputs.archive_cache_key }}

      - name: Retain encrypted stage evidence
        if: ${{ (success() || failure()) && steps.admission.outcome == 'success' }}
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/archive-evidence
          name: cache-archives-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-key: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
          encryption-recipient: ${{ vars.DIAGNOSTICS_ENCRYPTION_RECIPIENT }}
