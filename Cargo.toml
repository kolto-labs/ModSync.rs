[package]
name = "modsync"
version = "0.1.0"
edition = "2024"
description = "A Rust desktop and command-line installer for ModSync instruction files"
repository = "https://github.com/bodencrouch/ModSync.rs"
license-file = "LICENSE.txt"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
serde_yaml_ng = "0.10"
quick-xml = "0.41"
glob = "0.3"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
sevenz-rust2 = "0.22"
unrar = "0.5.8"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
shlex = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
eframe = { version = "0.32.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = { version = "0.15.4", optional = true }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
