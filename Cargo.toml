[package]
name = "modsync"
version = "0.1.0"
edition = "2024"
description = "A Rust desktop and command-line installer for ModSync instruction files"
repository = "https://github.com/bodencrouch/ModSync.rs"
license-file = "LICENSE.txt"

autobins = false

[[bin]]
name = "modsync"
path = "src/main.rs"

[[bin]]
name = "modsync-gui"
path = "src/bin/modsync-gui.rs"
required-features = ["gui"]

[features]
default = ["ui-qt"]
gui = []
ui-qt = ["gui", "dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]
ui-egui = ["gui", "dep:eframe", "dep:rfd", "dep:pulldown-cmark"]
desktop = ["ui-egui"]

[dependencies]
anyhow = "1"
odypatcher = { git = "https://github.com/kolto-labs/OdyPatcher", rev = "9b9ee8d1d25e2e97c87df4521a13965ced1e0b3f", default-features = false, features = ["nss-compiler"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
toml = { version = "0.9", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
unsafe-libyaml = "0.2.11"
quick-xml = "0.41"
glob = "0.3"
regex = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
sevenz-rust2 = "0.22"
unrar = "0.5.8"
unrar_sys = "0.5.8"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
sha1 = "0.10"
tempfile = "3"
fs2 = "0.4"
shlex = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
eframe = { version = "0.32.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = { version = "0.15.4", optional = true }
librqbit = { version = "9.0.1", features = ["disable-upload"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "net", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
mega = { version = "0.8.0", default-features = false, features = ["reqwest"] }
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
futures = "0.3"
icu_normalizer = "2"
libloading = "=0.8.9"
pulldown-cmark = { version = "=0.13.4", default-features = false, optional = true }
cxx = { version = "1", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"], optional = true }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", optional = true }

[profile.dev]
debug = 0

# Authoring checkpoints and exact lane comparisons hash entire game trees.
# Keep the application debuggable without using an unoptimized SHA-256 core.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_Globalization", "Win32_System_Time", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSAppleEventDescriptor", "NSAppleEventManager"] }

# unrar_sys 0.5.8 build-host/target correction; see vendor/unrar_sys/README.md.
[patch.crates-io]
serde_json = { path = "vendor/serde_json" }
unrar_sys = { path = "vendor/unrar_sys" }
