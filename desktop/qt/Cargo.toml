[package]
name = "modsync-desktop-qt"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE.txt"

[dependencies]
modsync = { path = "../..", default-features = false }
anyhow = "1"
serde_json = "1"
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"

[profile.dev]
debug = 0

[patch.crates-io]
serde_json = { path = "../../vendor/serde_json" }
unrar_sys = { path = "../../vendor/unrar_sys" }

[profile.dev.package."sha2:0.10.9"]
opt-level = 3
